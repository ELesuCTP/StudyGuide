    </g><text x="208" y="91" font-family="DejaVu Sans,sans-serif" font-size="40" font-weight="900" fill="#3a1246" stroke="#fff" stroke-width="5" paint-order="stroke">Atelectasis</text><text x="210" y="144" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#25152b">Alveoli close or collapse, reducing effective</text><text x="210" y="163" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#25152b">ventilation</text><path d="M194 32 L198 41 L208 45 L198 49 L194 59 L190 49 L180 45 L190 41Z" fill="#ffd52d" stroke="#24162b" stroke-width="2.5"/><path d="M 46 194 Q 58 185 76 193 Q 93 186 110 194 L 373 192 Q 414 198 406 230 L 404 512 Q 398 543 369 538 L 63 540 Q 24 536 30 502 L 32 230 Q 26 204 46 194 Z" fill="#f5efff" stroke="#24162b" stroke-width="4.2" stroke-linejoin="round"/><path d="M 46 198 Q 68 188 90 197 Q 110 189 129 197 L 384 197 Q 410 200 406 244 L 33 244 Q 26 212 46 198 Z" fill="#bfa8f5" stroke="#24162b" stroke-width="2.8" stroke-linejoin="round"/><path d="M383 212 L387 221 L397 225 L387 229 L383 239 L379 229 L369 225 L379 221Z" fill="#ffe24d" stroke="#24162b" stroke-width="2.5"/><text x="54" y="229" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="800" fill="#20152a">What Happens</text><circle cx="52" cy="262" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 262 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="268" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">Closure or collapse of</text><text x="71" y="289" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">alveoli; may be acute or</text><text x="71" y="310" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">chronic</text><circle cx="52" cy="332" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 332 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="338" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">May be obstructive or</text><text x="71" y="359" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">nonobstructive</text><circle cx="52" cy="381" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 381 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="387" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">Poorly ventilated areas can</text><text x="71" y="408" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">impair oxygenation</text><circle cx="52" cy="430" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 430 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="436" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">A chest X-ray may suggest</text><text x="71" y="457" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">atelectasis before symptoms</text><text x="71" y="478" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">appear</text><path d="M 448 207 Q 460 193 478 201 Q 495 194 512 202 L 785 200 Q 826 206 818 238 L 816 502 Q 810 533 781 528 L 465 530 Q 426 526 432 492 L 434 238 Q 428 212 448 207 Z" fill="#f0fae7" stroke="#24162b" stroke-width="4.2" stroke-linejoin="round"/><path d="M 448 206 Q 470 196 492 205 Q 512 197 531 205 L 796 205 Q 822 208 818 252 L 435 252 Q 428 220 448 206 Z" fill="#abe58e" stroke="#24162b" stroke-width="2.8" stroke-linejoin="round"/><path d="M795 220 L799 229 L809 233 L799 237 L795 247 L791 237 L781 233 L791 229Z" fill="#ffe24d" stroke="#24162b" stroke-width="2.5"/><text x="456" y="237" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="800" fill="#20152a">Assessment Cues</text><circle cx="454" cy="270" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M449 270 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="473" y="276" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">Increased work of breathing and</text><text x="473" y="296" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">hypoxemia</text><circle cx="454" cy="317" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M449 317 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="473" y="323" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">Decreased breath sounds and</text><text x="473" y="343" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">crackles over the affected area</text><circle cx="454" cy="364" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M449 364 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="473" y="370" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">Pulse oximetry may show oxygen</text><text x="473" y="390" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">saturation below 90 percent</text><circle cx="454" cy="411" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M449 411 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="473" y="417" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">Trend breathing effort and</text><text x="473" y="437" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">oxygenation, not one finding</text><text x="473" y="457" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">alone</text><path d="M 46 574 Q 58 555 76 563 Q 93 556 110 564 L 383 562 Q 424 568 416 600 L 414 952 Q 408 983 379 978 L 63 980 Q 24 976 30 942 L 32 600 Q 26 574 46 574 Z" fill="#fff8d9" stroke="#24162b" stroke-width="4.2" stroke-linejoin="round"/><path d="M 46 568 Q 68 558 90 567 Q 110 559 129 567 L 394 567 Q 420 570 416 614 L 33 614 Q 26 582 46 568 Z" fill="#ffd962" stroke="#24162b" stroke-width="2.8" stroke-linejoin="round"/><path d="M393 582 L397 591 L407 595 L397 599 L393 609 L389 599 L379 595 L389 591Z" fill="#ffe24d" stroke="#24162b" stroke-width="2.5"/><text x="54" y="599" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="800" fill="#20152a">Prevent and Expand</text><circle cx="52" cy="632" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 632 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="638" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">Turn frequently and promote</text><text x="71" y="658" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">early mobilization</text><circle cx="52" cy="679" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 679 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="685" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">Encourage voluntary deep</text><text x="71" y="705" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">breathing, coughing, and</text><text x="71" y="725" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">prescribed incentive spirometry</text><circle cx="52" cy="746" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 746 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="752" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">Use secretion-management</text><text x="71" y="772" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">strategies and prescribed</text><text x="71" y="792" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">inhaled therapy</text><circle cx="52" cy="813" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 813 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="819" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">A pressurized metered-dose</text><text x="71" y="839" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">inhaler is listed among the</text><text x="71" y="859" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">slide interventions</text><circle cx="52" cy="880" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 880 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="886" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">Coordinate an ICOUGH-style</text><text x="71" y="906" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">multidisciplinary approach when</text><text x="71" y="926" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">used by the facility</text><path d="M 458 549 Q 470 540 488 548 Q 505 541 522 549 L 785 547 Q 826 553 818 585 L 816 952 Q 810 983 781 978 L 475 980 Q 436 976 442 942 L 444 585 Q 438 559 458 549 Z" fill="#e9f1ff" stroke="#24162b" stroke-width="4.2" stroke-linejoin="round"/><path d="M 458 553 Q 480 543 502 552 Q 522 544 541 552 L 796 552 Q 822 555 818 599 L 445 599 Q 438 567 458 553 Z" fill="#a9c9ff" stroke="#24162b" stroke-width="2.8" stroke-linejoin="round"/><path d="M795 567 L799 576 L809 580 L799 584 L795 594 L791 584 L781 580 L791 576Z" fill="#ffe24d" stroke="#24162b" stroke-width="2.5"/><text x="466" y="576" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="800" fill="#20152a">If First-Line</text><text x="466" y="598" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="800" fill="#20152a">Measures Are Not</text><circle cx="464" cy="627" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M459 627 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="483" y="633" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">Improve ventilation and remove</text><text x="483" y="653" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">secretions; first-line care</text><text x="483" y="673" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">includes turning, ambulation,</text><text x="483" y="693" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">lung expansion, and coughing</text><circle cx="464" cy="714" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M459 714 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="483" y="720" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">Possible ordered therapies:</text><text x="483" y="740" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">PEEP or CPAP, chest</text><text x="483" y="760" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">physiotherapy, bronchoscopy,</text><text x="483" y="780" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">or mechanical ventilation</text><circle cx="464" cy="801" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M459 801 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="483" y="807" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">Thoracentesis may relieve</text><text x="483" y="827" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">compression from pleural fluid</text><circle cx="464" cy="848" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M459 848 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="483" y="854" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">Reassess oxygenation and</text><text x="483" y="874" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">response after each</text><text x="483" y="894" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">intervention</text><path d="M28 1015 Q39 1006 52 1014 Q66 1005 78 1014 L770 1014 Q783 1006 796 1014 Q809 1006 821 1019 L821 1067 Q808 1078 796 1070 Q781 1079 768 1070 L79 1070 Q65 1079 51 1070 Q38 1079 28 1068Z" fill="#f6eaff" stroke="#24162b" stroke-width="3.5"/><text x="48" y="1040" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="700" fill="#4d3e51">Source: Hinkle Chapter 19, slides 3-7</text><text x="790" y="1055" text-anchor="end" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="900" fill="#713a7d">02/25</text></svg>