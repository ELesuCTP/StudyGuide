    </g><text x="208" y="91" font-family="DejaVu Sans,sans-serif" font-size="40" font-weight="900" fill="#3a1246" stroke="#fff" stroke-width="5" paint-order="stroke">TB Medication Safety</text><text x="210" y="144" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#25152b">Know the classic RIPE names and what changes</text><text x="210" y="163" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#25152b">require prompt reporting</text><path d="M194 32 L198 41 L208 45 L198 49 L194 59 L190 49 L180 45 L190 41Z" fill="#ffd52d" stroke="#24162b" stroke-width="2.5"/><path d="M 46 194 Q 58 185 76 193 Q 93 186 110 194 L 391 192 Q 432 198 424 230 L 422 536 Q 416 567 387 562 L 63 564 Q 24 560 30 526 L 32 230 Q 26 204 46 194 Z" fill="#fff8d9" stroke="#24162b" stroke-width="4.2" stroke-linejoin="round"/><path d="M 46 198 Q 68 188 90 197 Q 110 189 129 197 L 402 197 Q 428 200 424 244 L 33 244 Q 26 212 46 198 Z" fill="#ffd962" stroke="#24162b" stroke-width="2.8" stroke-linejoin="round"/><path d="M401 212 L405 221 L415 225 L405 229 L401 239 L397 229 L387 225 L397 221Z" fill="#ffe24d" stroke="#24162b" stroke-width="2.5"/><text x="54" y="229" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="800" fill="#20152a">RIPE Memory</text><circle cx="52" cy="262" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 262 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="268" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">R - rifampin</text><circle cx="52" cy="292" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 292 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="298" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">I - isoniazid</text><circle cx="52" cy="322" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 322 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="328" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">P - pyrazinamide</text><circle cx="52" cy="352" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 352 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="358" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">E - ethambutol</text><circle cx="52" cy="382" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 382 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="388" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">The supplied Chapter 9</text><text x="71" y="411" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">review also lists</text><text x="71" y="434" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">rifapentine</text><path d="M 466 210 Q 478 196 496 204 Q 513 197 530 205 L 787 203 Q 828 209 820 241 L 818 530 Q 812 561 783 556 L 483 558 Q 444 554 450 520 L 452 241 Q 446 215 466 210 Z" fill="#e9f1ff" stroke="#24162b" stroke-width="4.2" stroke-linejoin="round"/><path d="M 466 209 Q 488 199 510 208 Q 530 200 549 208 L 798 208 Q 824 211 820 255 L 453 255 Q 446 223 466 209 Z" fill="#a9c9ff" stroke="#24162b" stroke-width="2.8" stroke-linejoin="round"/><path d="M797 223 L801 232 L811 236 L801 240 L797 250 L793 240 L783 236 L793 232Z" fill="#ffe24d" stroke="#24162b" stroke-width="2.5"/><text x="474" y="232" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="800" fill="#20152a">Monitor for Serious</text><text x="474" y="254" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="800" fill="#20152a">Reactions</text><circle cx="472" cy="283" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M467 283 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="491" y="289" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">Liver warning signs: yellow skin</text><text x="491" y="307" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">or eyes, dark urine, abdominal</text><text x="491" y="325" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">pain, nausea, poor appetite, or</text><text x="491" y="343" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">unusual fatigue</text><circle cx="472" cy="362" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M467 362 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="491" y="368" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">Isoniazid can cause peripheral</text><text x="491" y="386" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">neuropathy; report tingling,</text><text x="491" y="404" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">numbness, or pain</text><circle cx="472" cy="423" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M467 423 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="491" y="429" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">Ethambutol can affect vision and</text><text x="491" y="447" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">color vision; report changes</text><text x="491" y="465" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">promptly</text><circle cx="472" cy="484" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M467 484 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="491" y="490" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">Rifampin and rifapentine can</text><text x="491" y="508" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">interact with many medicines</text><path d="M 47 599 Q 59 580 77 588 Q 94 581 111 589 L 368 587 Q 409 593 401 625 L 399 947 Q 393 978 364 973 L 64 975 Q 25 971 31 937 L 33 625 Q 27 599 47 599 Z" fill="#e8faff" stroke="#24162b" stroke-width="4.2" stroke-linejoin="round"/><path d="M 47 593 Q 69 583 91 592 Q 111 584 130 592 L 379 592 Q 405 595 401 639 L 34 639 Q 27 607 47 593 Z" fill="#86dfeb" stroke="#24162b" stroke-width="2.8" stroke-linejoin="round"/><path d="M378 607 L382 616 L392 620 L382 624 L378 634 L374 624 L364 620 L374 616Z" fill="#ffe24d" stroke="#24162b" stroke-width="2.5"/><text x="55" y="616" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="800" fill="#20152a">Teaching and</text><text x="55" y="638" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="800" fill="#20152a">Follow-Up</text><circle cx="53" cy="667" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M48 667 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="673" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">Do not stop or skip TB medicines</text><text x="72" y="691" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">without the TB care team&#x27;s</text><text x="72" y="709" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">direction</text><circle cx="53" cy="728" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M48 728 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="734" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">Give an accurate medication list</text><text x="72" y="752" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">and attend scheduled follow-up</text><circle cx="53" cy="771" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M48 771 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="777" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">CDC recommends at least monthly</text><text x="72" y="795" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">clinical evaluation for</text><text x="72" y="813" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">adherence and adverse reactions</text><text x="72" y="831" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">during TB disease treatment</text><circle cx="53" cy="850" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M48 850 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="856" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">Avoid interpreting the classic</text><text x="72" y="874" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">lecture regimen as the only</text><text x="72" y="892" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">current option; follow TB</text><text x="72" y="910" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">expertise and susceptibility</text><text x="72" y="928" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">results</text><path d="M 438 578 Q 450 569 468 577 Q 485 570 502 578 L 787 576 Q 828 582 820 614 L 818 948 Q 812 979 783 974 L 455 976 Q 416 972 422 938 L 424 614 Q 418 588 438 578 Z" fill="#fff0f6" stroke="#24162b" stroke-width="4.2" stroke-linejoin="round"/><path d="M 438 582 Q 460 572 482 581 Q 502 573 521 581 L 798 581 Q 824 584 820 628 L 425 628 Q 418 596 438 582 Z" fill="#f39dd0" stroke="#24162b" stroke-width="2.8" stroke-linejoin="round"/><path d="M797 596 L801 605 L811 609 L801 613 L797 623 L793 613 L783 609 L793 605Z" fill="#ffe24d" stroke="#24162b" stroke-width="2.5"/><text x="446" y="605" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="800" fill="#20152a">Current Practice</text><text x="446" y="627" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="800" fill="#20152a">Note</text><circle cx="444" cy="656" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M439 656 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="463" y="662" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">The source slides state 6-12 months</text><text x="463" y="680" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">and four or more initial drugs</text><circle cx="444" cy="699" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M439 699 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="463" y="705" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">CDC guidance now includes a 4-month</text><text x="463" y="723" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">regimen for eligible adults and</text><text x="463" y="741" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">adolescents with drug-susceptible</text><text x="463" y="759" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">pulmonary TB</text><circle cx="444" cy="778" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M439 778 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="463" y="784" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">Other patients may need a different</text><text x="463" y="802" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">6- or 9-month regimen, based on</text><text x="463" y="820" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">clinical factors</text><circle cx="444" cy="839" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M439 839 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="463" y="845" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">For class: know the course&#x27;s</text><text x="463" y="863" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">classic RIPE framework; for care:</text><text x="463" y="881" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">use current TB-program guidance</text><path d="M28 1015 Q39 1006 52 1014 Q66 1005 78 1014 L770 1014 Q783 1006 796 1014 Q809 1006 821 1019 L821 1067 Q808 1078 796 1070 Q781 1079 768 1070 L79 1070 Q65 1079 51 1070 Q38 1079 28 1068Z" fill="#f6eaff" stroke="#24162b" stroke-width="3.5"/><text x="48" y="1040" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="700" fill="#4d3e51">Source: Chapter 19 course documents; CDC adverse-event guidance</text><text x="790" y="1055" text-anchor="end" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="900" fill="#713a7d">10/25</text></svg>