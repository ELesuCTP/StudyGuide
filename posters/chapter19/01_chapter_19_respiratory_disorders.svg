 font-size="16" font-weight="600" fill="#201b2a">tracheobronchitis</text><circle cx="52" cy="321" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 321 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="327" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">Pneumonia, aspiration, and</text><text x="71" y="348" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">pulmonary tuberculosis</text><circle cx="52" cy="370" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 370 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="376" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">Lung abscess and sarcoidosis</text><circle cx="52" cy="398" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 398 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="404" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">Pleural disease, respiratory</text><text x="71" y="425" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">failure, and ARDS</text><circle cx="52" cy="447" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 447 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="453" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">Pulmonary vascular disorders,</text><text x="71" y="474" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">occupational disease, lung</text><text x="71" y="495" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">cancer, and chest trauma</text><path d="M 466 210 Q 478 196 496 204 Q 513 197 530 205 L 787 203 Q 828 209 820 241 L 818 530 Q 812 561 783 556 L 483 558 Q 444 554 450 520 L 452 241 Q 446 215 466 210 Z" fill="#f5efff" stroke="#24162b" stroke-width="4.2" stroke-linejoin="round"/><path d="M 466 209 Q 488 199 510 208 Q 530 200 549 208 L 798 208 Q 824 211 820 255 L 453 255 Q 446 223 466 209 Z" fill="#bfa8f5" stroke="#24162b" stroke-width="2.8" stroke-linejoin="round"/><path d="M797 223 L801 232 L811 236 L801 240 L797 250 L793 240 L783 236 L793 232Z" fill="#ffe24d" stroke="#24162b" stroke-width="2.5"/><text x="474" y="232" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="800" fill="#20152a">Respiratory Words to</text><text x="474" y="254" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="800" fill="#20152a">Know</text><circle cx="472" cy="283" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M467 283 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="491" y="289" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">Hypoxemia: low oxygen in</text><text x="491" y="310" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">arterial blood</text><circle cx="472" cy="332" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M467 332 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="491" y="338" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">Hypercapnia: excess carbon</text><text x="491" y="359" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">dioxide in blood</text><circle cx="472" cy="381" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M467 381 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="491" y="387" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">Dyspnea: difficult or</text><text x="491" y="408" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">uncomfortable breathing</text><circle cx="472" cy="430" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M467 430 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="491" y="436" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">Pleuritic pain: sharp pain</text><text x="491" y="457" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">linked to breathing</text><circle cx="472" cy="479" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M467 479 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="491" y="485" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">Hemoptysis: coughing up</text><text x="491" y="506" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">blood</text><path d="M 47 599 Q 59 580 77 588 Q 94 581 111 589 L 368 587 Q 409 593 401 625 L 399 947 Q 393 978 364 973 L 64 975 Q 25 971 31 937 L 33 625 Q 27 599 47 599 Z" fill="#f0fae7" stroke="#24162b" stroke-width="4.2" stroke-linejoin="round"/><path d="M 47 593 Q 69 583 91 592 Q 111 584 130 592 L 379 592 Q 405 595 401 639 L 34 639 Q 27 607 47 593 Z" fill="#abe58e" stroke="#24162b" stroke-width="2.8" stroke-linejoin="round"/><path d="M378 607 L382 616 L392 620 L382 624 L378 634 L374 624 L364 620 L374 616Z" fill="#ffe24d" stroke="#24162b" stroke-width="2.5"/><text x="55" y="616" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="800" fill="#20152a">Assessment Starts</text><text x="55" y="638" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="800" fill="#20152a">with Trends</text><circle cx="53" cy="667" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M48 667 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="673" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">Respiratory rate, work of</text><text x="72" y="693" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">breathing, lung sounds,</text><text x="72" y="713" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">oxygen saturation, and vital</text><text x="72" y="733" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">signs</text><circle cx="53" cy="754" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M48 754 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="760" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">Cough pattern and secretions:</text><text x="72" y="780" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">amount, color, and odor</text><circle cx="53" cy="801" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M48 801 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="807" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">Mental status, fatigue,</text><text x="72" y="827" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">intake, hydration, and</text><text x="72" y="847" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">activity tolerance</text><circle cx="53" cy="868" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M48 868 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="874" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">Compare findings with the</text><text x="72" y="894" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">patient&#x27;s baseline and the</text><text x="72" y="914" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">change over time</text><path d="M 438 578 Q 450 569 468 577 Q 485 570 502 578 L 787 576 Q 828 582 820 614 L 818 948 Q 812 979 783 974 L 455 976 Q 416 972 422 938 L 424 614 Q 418 588 438 578 Z" fill="#fff8d9" stroke="#24162b" stroke-width="4.2" stroke-linejoin="round"/><path d="M 438 582 Q 460 572 482 581 Q 502 573 521 581 L 798 581 Q 824 584 820 628 L 425 628 Q 418 596 438 582 Z" fill="#ffd962" stroke="#24162b" stroke-width="2.8" stroke-linejoin="round"/><path d="M797 596 L801 605 L811 609 L801 613 L797 623 L793 613 L783 609 L793 605Z" fill="#ffe24d" stroke="#24162b" stroke-width="2.5"/><text x="446" y="605" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="800" fill="#20152a">Escalate</text><text x="446" y="627" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="800" fill="#20152a">Deterioration</text><circle cx="444" cy="656" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M439 656 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="463" y="662" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">New restlessness or confusion</text><text x="463" y="683" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">can signal poor oxygenation or</text><text x="463" y="704" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">worsening illness</text><circle cx="444" cy="726" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M439 726 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="463" y="732" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">Increasing respiratory effort,</text><text x="463" y="753" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">tachypnea, or falling oxygen</text><text x="463" y="774" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">saturation needs prompt</text><text x="463" y="795" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">reassessment</text><circle cx="444" cy="817" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M439 817 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="463" y="823" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">Cyanosis and respiratory</text><text x="463" y="844" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">arrest are late danger signs</text><circle cx="444" cy="866" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M439 866 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="463" y="872" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">Follow orders and facility</text><text x="463" y="893" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">escalation procedures;</text><text x="463" y="914" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">reassess response to</text><text x="463" y="935" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">interventions</text><path d="M28 1015 Q39 1006 52 1014 Q66 1005 78 1014 L770 1014 Q783 1006 796 1014 Q809 1006 821 1019 L821 1067 Q808 1078 796 1070 Q781 1079 768 1070 L79 1070 Q65 1079 51 1070 Q38 1079 28 1068Z" fill="#f6eaff" stroke="#24162b" stroke-width="3.5"/><text x="48" y="1040" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="700" fill="#4d3e51">Source: Hinkle Chapter 19, slides 1-2</text><text x="790" y="1055" text-anchor="end" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="900" fill="#713a7d">01/25</text></svg>