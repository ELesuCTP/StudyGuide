    </g><text x="208" y="71" font-family="DejaVu Sans,sans-serif" font-size="27" font-weight="900" fill="#3a1246" stroke="#fff" stroke-width="5" paint-order="stroke">Bacterial Pneumonia</text><text x="208" y="100" font-family="DejaVu Sans,sans-serif" font-size="27" font-weight="900" fill="#3a1246" stroke="#fff" stroke-width="5" paint-order="stroke">Complications</text><text x="210" y="148" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#25152b">Recognize worsening illness and protect</text><text x="210" y="167" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#25152b">airway, oxygenation, and circulation</text><path d="M194 32 L198 41 L208 45 L198 49 L194 59 L190 49 L180 45 L190 41Z" fill="#ffd52d" stroke="#24162b" stroke-width="2.5"/><path d="M 46 194 Q 58 185 76 193 Q 93 186 110 194 L 391 192 Q 432 198 424 230 L 422 536 Q 416 567 387 562 L 63 564 Q 24 560 30 526 L 32 230 Q 26 204 46 194 Z" fill="#fff0f6" stroke="#24162b" stroke-width="4.2" stroke-linejoin="round"/><path d="M 46 198 Q 68 188 90 197 Q 110 189 129 197 L 402 197 Q 428 200 424 244 L 33 244 Q 26 212 46 198 Z" fill="#f39dd0" stroke="#24162b" stroke-width="2.8" stroke-linejoin="round"/><path d="M401 212 L405 221 L415 225 L405 229 L401 239 L397 229 L387 225 L397 221Z" fill="#ffe24d" stroke="#24162b" stroke-width="2.5"/><text x="54" y="229" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="800" fill="#20152a">Complication Watch</text><circle cx="52" cy="262" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 262 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="268" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Symptoms that continue</text><text x="71" y="291" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">after therapy begins</text><circle cx="52" cy="315" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 315 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="321" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Sepsis or septic shock</text><circle cx="52" cy="345" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 345 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="351" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Respiratory failure,</text><text x="71" y="374" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">atelectasis, or pleural</text><text x="71" y="397" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">effusion</text><circle cx="52" cy="421" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 421 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="427" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Delirium, especially when</text><text x="71" y="450" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">accompanied by other signs</text><text x="71" y="473" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">of deterioration</text><path d="M 466 210 Q 478 196 496 204 Q 513 197 530 205 L 787 203 Q 828 209 820 241 L 818 530 Q 812 561 783 556 L 483 558 Q 444 554 450 520 L 452 241 Q 446 215 466 210 Z" fill="#f5efff" stroke="#24162b" stroke-width="4.2" stroke-linejoin="round"/><path d="M 466 209 Q 488 199 510 208 Q 530 200 549 208 L 798 208 Q 824 211 820 255 L 453 255 Q 446 223 466 209 Z" fill="#bfa8f5" stroke="#24162b" stroke-width="2.8" stroke-linejoin="round"/><path d="M797 223 L801 232 L811 236 L801 240 L797 250 L793 240 L783 236 L793 232Z" fill="#ffe24d" stroke="#24162b" stroke-width="2.5"/><text x="474" y="240" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="800" fill="#20152a">Goals of Care</text><circle cx="472" cy="273" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M467 273 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="491" y="279" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">Improve airway patency and</text><text x="491" y="300" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">activity</text><circle cx="472" cy="322" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M467 322 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="491" y="328" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">Maintain appropriate fluid</text><text x="491" y="349" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">volume and nutrition</text><circle cx="472" cy="371" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M467 371 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="491" y="377" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">Understand the treatment</text><text x="491" y="398" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">plan and prevention</text><text x="491" y="419" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">strategies</text><circle cx="472" cy="441" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M467 441 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="491" y="447" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">Avoid complications and plan</text><text x="491" y="468" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">for home, community, or</text><text x="491" y="489" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">transitional care</text><path d="M 47 599 Q 59 580 77 588 Q 94 581 111 589 L 368 587 Q 409 593 401 625 L 399 947 Q 393 978 364 973 L 64 975 Q 25 971 31 937 L 33 625 Q 27 599 47 599 Z" fill="#f0fae7" stroke="#24162b" stroke-width="4.2" stroke-linejoin="round"/><path d="M 47 593 Q 69 583 91 592 Q 111 584 130 592 L 379 592 Q 405 595 401 639 L 34 639 Q 27 607 47 593 Z" fill="#abe58e" stroke="#24162b" stroke-width="2.8" stroke-linejoin="round"/><path d="M378 607 L382 616 L392 620 L382 624 L378 634 L374 624 L364 620 L374 616Z" fill="#ffe24d" stroke="#24162b" stroke-width="2.5"/><text x="55" y="624" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="800" fill="#20152a">Expected Outcomes</text><circle cx="53" cy="657" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M48 657 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="663" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Improved airway patency</text><circle cx="53" cy="687" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M48 687 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="693" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Rest and energy</text><text x="72" y="716" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">conservation, followed</text><text x="72" y="739" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">by gradual activity</text><text x="72" y="762" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">increase</text><circle cx="53" cy="786" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M48 786 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="792" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Adequate hydration and</text><text x="72" y="815" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">dietary intake</text><circle cx="53" cy="839" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M48 839 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="845" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Patient describes and</text><text x="72" y="868" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">follows management</text><text x="72" y="891" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">strategies without</text><text x="72" y="914" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">complications</text><path d="M 438 578 Q 450 569 468 577 Q 485 570 502 578 L 787 576 Q 828 582 820 614 L 818 948 Q 812 979 783 974 L 455 976 Q 416 972 422 938 L 424 614 Q 418 588 438 578 Z" fill="#fff8d9" stroke="#24162b" stroke-width="4.2" stroke-linejoin="round"/><path d="M 438 582 Q 460 572 482 581 Q 502 573 521 581 L 798 581 Q 824 584 820 628 L 425 628 Q 418 596 438 582 Z" fill="#ffd962" stroke="#24162b" stroke-width="2.8" stroke-linejoin="round"/><path d="M797 596 L801 605 L811 609 L801 613 L797 623 L793 613 L783 609 L793 605Z" fill="#ffe24d" stroke="#24162b" stroke-width="2.5"/><text x="446" y="613" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="800" fill="#20152a">Antibiotic Safety</text><circle cx="444" cy="646" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M439 646 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="463" y="652" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">Administer the prescribed drug on</text><text x="463" y="670" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">schedule; obtain ordered cultures</text><text x="463" y="688" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">first when feasible without</text><text x="463" y="706" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">delaying urgent treatment</text><circle cx="444" cy="725" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M439 725 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="463" y="731" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">Check allergies and monitor for</text><text x="463" y="749" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">rash, diarrhea, or other adverse</text><text x="463" y="767" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">effects</text><circle cx="444" cy="786" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M439 786 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="463" y="792" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">Evaluate clinical response and</text><text x="463" y="810" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">follow culture results or treatment</text><text x="463" y="828" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">changes</text><circle cx="444" cy="847" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M439 847 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="463" y="853" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">Teach the patient to complete the</text><text x="463" y="871" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">prescribed course and report</text><text x="463" y="889" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">concerning reactions</text><path d="M28 1015 Q39 1006 52 1014 Q66 1005 78 1014 L770 1014 Q783 1006 796 1014 Q809 1006 821 1019 L821 1067 Q808 1078 796 1070 Q781 1079 768 1070 L79 1070 Q65 1079 51 1070 Q38 1079 28 1068Z" fill="#f6eaff" stroke="#24162b" stroke-width="3.5"/><text x="48" y="1040" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="700" fill="#4d3e51">Source: Hinkle Chapter 19, slides 21-24; Chapter 19 antibiotic review</text><text x="790" y="1055" text-anchor="end" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="900" fill="#713a7d">07/25</text></svg>