    </g><text x="208" y="91" font-family="DejaVu Sans,sans-serif" font-size="40" font-weight="900" fill="#3a1246" stroke="#fff" stroke-width="5" paint-order="stroke">Empyema</text><text x="210" y="144" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#25152b">Thick purulent fluid accumulates in the</text><text x="210" y="163" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#25152b">pleural space</text><path d="M194 32 L198 41 L208 45 L198 49 L194 59 L190 49 L180 45 L190 41Z" fill="#ffd52d" stroke="#24162b" stroke-width="2.5"/><path d="M 46 194 Q 58 185 76 193 Q 93 186 110 194 L 783 192 Q 824 198 816 230 L 814 397 Q 808 428 779 423 L 63 425 Q 24 421 30 387 L 32 230 Q 26 204 46 194 Z" fill="#f0fae7" stroke="#24162b" stroke-width="4.2" stroke-linejoin="round"/><path d="M 46 198 Q 68 188 90 197 Q 110 189 129 197 L 794 197 Q 820 200 816 244 L 33 244 Q 26 212 46 198 Z" fill="#abe58e" stroke="#24162b" stroke-width="2.8" stroke-linejoin="round"/><path d="M793 212 L797 221 L807 225 L797 229 L793 239 L789 229 L779 225 L789 221Z" fill="#ffe24d" stroke="#24162b" stroke-width="2.5"/><text x="54" y="229" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="800" fill="#20152a">How It Develops</text><circle cx="52" cy="262" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 262 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="268" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">May complicate bacterial pneumonia or a lung abscess</text><circle cx="52" cy="287" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 287 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="293" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">The patient may appear acutely ill with infection-like findings</text><circle cx="52" cy="312" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 312 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="318" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">Chest auscultation may show decreased or absent breath sounds over the</text><text x="71" y="336" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">affected area</text><circle cx="52" cy="355" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 355 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="361" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">Empyema is not simply a dry pleural inflammation; purulent fluid is present</text><path d="M 46 454 Q 58 440 76 448 Q 93 441 110 449 L 385 447 Q 426 453 418 485 L 416 697 Q 410 728 381 723 L 63 725 Q 24 721 30 687 L 32 485 Q 26 459 46 454 Z" fill="#fff8d9" stroke="#24162b" stroke-width="4.2" stroke-linejoin="round"/><path d="M 46 453 Q 68 443 90 452 Q 110 444 129 452 L 396 452 Q 422 455 418 499 L 33 499 Q 26 467 46 453 Z" fill="#ffd962" stroke="#24162b" stroke-width="2.8" stroke-linejoin="round"/><path d="M395 467 L399 476 L409 480 L399 484 L395 494 L391 484 L381 480 L391 476Z" fill="#ffe24d" stroke="#24162b" stroke-width="2.5"/><text x="54" y="476" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="800" fill="#20152a">Assessment and</text><text x="54" y="498" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="800" fill="#20152a">Diagnosis</text><circle cx="52" cy="527" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 527 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="533" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">Assess acute respiratory</text><text x="71" y="553" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">infection or pneumonia findings</text><circle cx="52" cy="574" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 574 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="580" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">Chest CT</text><circle cx="52" cy="601" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 601 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="607" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">Diagnostic thoracentesis</text><circle cx="52" cy="628" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 628 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="634" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">Monitor respiratory status and</text><text x="71" y="654" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">response to drainage and</text><text x="71" y="674" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">medication</text><path d="M 458 469 Q 470 450 488 458 Q 505 451 522 459 L 783 457 Q 824 463 816 495 L 814 697 Q 808 728 779 723 L 475 725 Q 436 721 442 687 L 444 495 Q 438 469 458 469 Z" fill="#e9f1ff" stroke="#24162b" stroke-width="4.2" stroke-linejoin="round"/><path d="M 458 463 Q 480 453 502 462 Q 522 454 541 462 L 794 462 Q 820 465 816 509 L 445 509 Q 438 477 458 463 Z" fill="#a9c9ff" stroke="#24162b" stroke-width="2.8" stroke-linejoin="round"/><path d="M793 477 L797 486 L807 490 L797 494 L793 504 L789 494 L779 490 L789 486Z" fill="#ffe24d" stroke="#24162b" stroke-width="2.5"/><text x="466" y="494" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="800" fill="#20152a">Treatment</text><circle cx="464" cy="527" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M459 527 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="483" y="533" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">Drain the pleural fluid</text><circle cx="464" cy="550" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M459 550 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="483" y="556" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">The lecture specifies antibiotics for</text><text x="483" y="572" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">4-6 weeks</text><circle cx="464" cy="589" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M459 589 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="483" y="595" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">The supplied exam review emphasizes</text><text x="483" y="611" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">culture- and source-guided antibiotic</text><text x="483" y="627" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">selection</text><circle cx="464" cy="644" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M459 644 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="483" y="650" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">Broad IV antibiotics may be started</text><text x="483" y="666" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">while cultures are pending, as</text><text x="483" y="682" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">prescribed</text><path d="M 46 751 Q 58 742 76 750 Q 93 743 110 751 L 783 749 Q 824 755 816 787 L 814 959 Q 808 990 779 985 L 63 987 Q 24 983 30 949 L 32 787 Q 26 761 46 751 Z" fill="#e8faff" stroke="#24162b" stroke-width="4.2" stroke-linejoin="round"/><path d="M 46 755 Q 68 745 90 754 Q 110 746 129 754 L 794 754 Q 820 757 816 801 L 33 801 Q 26 769 46 755 Z" fill="#86dfeb" stroke="#24162b" stroke-width="2.8" stroke-linejoin="round"/><path d="M793 769 L797 778 L807 782 L797 786 L793 796 L789 786 L779 782 L789 778Z" fill="#ffe24d" stroke="#24162b" stroke-width="2.5"/><text x="54" y="786" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="800" fill="#20152a">Nursing Care</text><circle cx="52" cy="819" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 819 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="825" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">Support lung-expanding breathing exercises</text><circle cx="52" cy="847" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 847 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="853" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">Monitor the patient&#x27;s breathing, comfort, and response to drainage</text><circle cx="52" cy="875" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 875 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="881" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">Provide psychosocial support</text><circle cx="52" cy="903" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 903 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="909" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">Reinforce medication adherence and follow-up plan</text><path d="M28 1015 Q39 1006 52 1014 Q66 1005 78 1014 L770 1014 Q783 1006 796 1014 Q809 1006 821 1019 L821 1067 Q808 1078 796 1070 Q781 1079 768 1070 L79 1070 Q65 1079 51 1070 Q38 1079 28 1068Z" fill="#f6eaff" stroke="#24162b" stroke-width="3.5"/><text x="48" y="1040" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="700" fill="#4d3e51">Source: Hinkle Chapter 19, slide 45; Chapter 19 antibiotic review</text><text x="790" y="1055" text-anchor="end" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="900" fill="#713a7d">15/25</text></svg>