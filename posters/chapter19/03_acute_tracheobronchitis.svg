    </g><g stroke="#24162b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
      <path d="M724 54 L724 102 M724 79 L697 104 M724 79 L751 104" fill="none"/>
      <path d="M695 91 Q672 94 665 122 L658 164 Q656 186 676 187 Q703 188 713 161 L720 119 L720 98Z" fill="#ff9bc7"/>
