    </g><text x="208" y="91" font-family="DejaVu Sans,sans-serif" font-size="40" font-weight="900" fill="#3a1246" stroke="#fff" stroke-width="5" paint-order="stroke">Lung Abscess</text><text x="210" y="144" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#25152b">A localized infection that may follow</text><text x="210" y="163" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#25152b">bacterial pneumonia</text><path d="M194 32 L198 41 L208 45 L198 49 L194 59 L190 49 L180 45 L190 41Z" fill="#ffd52d" stroke="#24162b" stroke-width="2.5"/><path d="M 46 194 Q 58 185 76 193 Q 93 186 110 194 L 373 192 Q 414 198 406 230 L 404 512 Q 398 543 369 538 L 63 540 Q 24 536 30 502 L 32 230 Q 26 204 46 194 Z" fill="#e9f1ff" stroke="#24162b" stroke-width="4.2" stroke-linejoin="round"/><path d="M 46 198 Q 68 188 90 197 Q 110 189 129 197 L 384 197 Q 410 200 406 244 L 33 244 Q 26 212 46 198 Z" fill="#a9c9ff" stroke="#24162b" stroke-width="2.8" stroke-linejoin="round"/><path d="M383 212 L387 221 L397 225 L387 229 L383 239 L379 229 L369 225 L379 221Z" fill="#ffe24d" stroke="#24162b" stroke-width="2.5"/><text x="54" y="229" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="800" fill="#20152a">Causes and Symptoms</text><circle cx="52" cy="262" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 262 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="268" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">Most lung abscesses are</text><text x="71" y="286" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">complications of bacterial</text><text x="71" y="304" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">pneumonia</text><circle cx="52" cy="323" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 323 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="329" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">Location relates to gravity and</text><text x="71" y="347" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">patient position</text><circle cx="52" cy="366" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 366 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="372" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">Productive cough with foul</text><text x="71" y="390" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">sputum, pleurisy, dyspnea,</text><text x="71" y="408" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">weakness, anorexia, and weight</text><text x="71" y="426" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">loss</text><circle cx="52" cy="445" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 445 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="451" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">The course can range from mild</text><text x="71" y="469" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">productive cough to acute</text><text x="71" y="487" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">illness</text><path d="M 448 207 Q 460 193 478 201 Q 495 194 512 202 L 785 200 Q 826 206 818 238 L 816 502 Q 810 533 781 528 L 465 530 Q 426 526 432 492 L 434 238 Q 428 212 448 207 Z" fill="#e8faff" stroke="#24162b" stroke-width="4.2" stroke-linejoin="round"/><path d="M 448 206 Q 470 196 492 205 Q 512 197 531 205 L 796 205 Q 822 208 818 252 L 435 252 Q 428 220 448 206 Z" fill="#86dfeb" stroke="#24162b" stroke-width="2.8" stroke-linejoin="round"/><path d="M795 220 L799 229 L809 233 L799 237 L795 247 L791 237 L781 233 L791 229Z" fill="#ffe24d" stroke="#24162b" stroke-width="2.5"/><text x="456" y="229" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="800" fill="#20152a">Possible</text><text x="456" y="251" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="800" fill="#20152a">Complications</text><circle cx="454" cy="280" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M449 280 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="473" y="286" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Empyema</text><circle cx="454" cy="310" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M449 310 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="473" y="316" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Bronchopleural fistula</text><circle cx="454" cy="340" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M449 340 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="473" y="346" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Pleural friction rub and</text><text x="473" y="369" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">crackles may be found</text><circle cx="454" cy="393" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M449 393 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="473" y="399" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Monitor clinical response</text><text x="473" y="422" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">and promptly report</text><text x="473" y="445" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">worsening respiratory</text><text x="473" y="468" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">status</text><path d="M 46 574 Q 58 555 76 563 Q 93 556 110 564 L 383 562 Q 424 568 416 600 L 414 952 Q 408 983 379 978 L 63 980 Q 24 976 30 942 L 32 600 Q 26 574 46 574 Z" fill="#fff0f6" stroke="#24162b" stroke-width="4.2" stroke-linejoin="round"/><path d="M 46 568 Q 68 558 90 567 Q 110 559 129 567 L 394 567 Q 420 570 416 614 L 33 614 Q 26 582 46 568 Z" fill="#f39dd0" stroke="#24162b" stroke-width="2.8" stroke-linejoin="round"/><path d="M393 582 L397 591 L407 595 L397 599 L393 609 L389 599 L379 595 L389 591Z" fill="#ffe24d" stroke="#24162b" stroke-width="2.5"/><text x="54" y="591" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="800" fill="#20152a">Assessment and</text><text x="54" y="613" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="800" fill="#20152a">Diagnosis</text><circle cx="52" cy="642" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 642 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="648" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Chest X-ray and CT of the</text><text x="71" y="671" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">chest</text><circle cx="52" cy="695" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 695 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="701" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Sputum culture</text><circle cx="52" cy="725" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 725 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="731" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Bronchoscopy may be used</text><circle cx="52" cy="755" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 755 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="761" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Use the patient&#x27;s</text><text x="71" y="784" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">symptoms, examination, and</text><text x="71" y="807" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">test results together</text><path d="M 458 549 Q 470 540 488 548 Q 505 541 522 549 L 785 547 Q 826 553 818 585 L 816 952 Q 810 983 781 978 L 475 980 Q 436 976 442 942 L 444 585 Q 438 559 458 549 Z" fill="#f5efff" stroke="#24162b" stroke-width="4.2" stroke-linejoin="round"/><path d="M 458 553 Q 480 543 502 552 Q 522 544 541 552 L 796 552 Q 822 555 818 599 L 445 599 Q 438 567 458 553 Z" fill="#bfa8f5" stroke="#24162b" stroke-width="2.8" stroke-linejoin="round"/><path d="M795 567 L799 576 L809 580 L799 584 L795 594 L791 584 L781 580 L791 576Z" fill="#ffe24d" stroke="#24162b" stroke-width="2.5"/><text x="466" y="576" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="800" fill="#20152a">Treatment and</text><text x="466" y="598" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="800" fill="#20152a">Nursing Care</text><circle cx="464" cy="627" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M459 627 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="483" y="633" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">Support drainage, chest</text><text x="483" y="651" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">physiotherapy, and deep</text><text x="483" y="669" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">breathing and coughing</text><circle cx="464" cy="688" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M459 688 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="483" y="694" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">The slides list antimicrobial</text><text x="483" y="712" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">therapy and IV antibiotics</text><circle cx="464" cy="731" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M459 731 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="483" y="737" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">The supplied review names</text><text x="483" y="755" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">ampicillin-sulbactam or</text><text x="483" y="773" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">amoxicillin-clavulanate as</text><text x="483" y="791" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">examples when anaerobes may be</text><text x="483" y="809" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">involved</text><circle cx="464" cy="828" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M459 828 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="483" y="834" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">Encourage high-protein,</text><text x="483" y="852" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">high-calorie nutrition and</text><text x="483" y="870" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">provide emotional support</text><circle cx="464" cy="889" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M459 889 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="483" y="895" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">Pulmonary resection is rare but</text><text x="483" y="913" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">appears as an option in the</text><text x="483" y="931" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">slides</text><path d="M28 1015 Q39 1006 52 1014 Q66 1005 78 1014 L770 1014 Q783 1006 796 1014 Q809 1006 821 1019 L821 1067 Q808 1078 796 1070 Q781 1079 768 1070 L79 1070 Q65 1079 51 1070 Q38 1079 28 1068Z" fill="#f6eaff" stroke="#24162b" stroke-width="3.5"/><text x="48" y="1040" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="700" fill="#4d3e51">Source: Hinkle Chapter 19, slides 33-36; Chapter 19 antibiotic review</text><text x="790" y="1055" text-anchor="end" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="900" fill="#713a7d">11/25</text></svg>