    </g><text x="208" y="91" font-family="DejaVu Sans,sans-serif" font-size="40" font-weight="900" fill="#3a1246" stroke="#fff" stroke-width="5" paint-order="stroke">Occupational Lung Disease</text><text x="210" y="144" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#25152b">Pneumoconioses result from inhaled mineral or</text><text x="210" y="163" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#25152b">inorganic dust</text><path d="M194 32 L198 41 L208 45 L198 49 L194 59 L190 49 L180 45 L190 41Z" fill="#ffd52d" stroke="#24162b" stroke-width="2.5"/><path d="M 46 194 Q 58 185 76 193 Q 93 186 110 194 L 391 192 Q 432 198 424 230 L 422 536 Q 416 567 387 562 L 63 564 Q 24 560 30 526 L 32 230 Q 26 204 46 194 Z" fill="#fff0f6" stroke="#24162b" stroke-width="4.2" stroke-linejoin="round"/><path d="M 46 198 Q 68 188 90 197 Q 110 189 129 197 L 402 197 Q 428 200 424 244 L 33 244 Q 26 212 46 198 Z" fill="#f39dd0" stroke="#24162b" stroke-width="2.8" stroke-linejoin="round"/><path d="M401 212 L405 221 L415 225 L405 229 L401 239 L397 229 L387 225 L397 221Z" fill="#ffe24d" stroke="#24162b" stroke-width="2.5"/><text x="54" y="229" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="800" fill="#20152a">Types and Mechanism</text><circle cx="52" cy="262" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 262 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="268" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">The slide lists asbestosis,</text><text x="71" y="289" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">silicosis, and coal workers&#x27;</text><text x="71" y="310" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">pneumoconiosis</text><circle cx="52" cy="332" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 332 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="338" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">A nonneoplastic lung</text><text x="71" y="359" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">alteration follows inhalation</text><text x="71" y="380" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">of mineral or inorganic dust</text><circle cx="52" cy="402" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 402 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="408" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">Workplace exposure history is</text><text x="71" y="429" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">central to assessment</text><circle cx="52" cy="451" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 451 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="457" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">The lecture describes these</text><text x="71" y="478" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">disorders as preventable, not</text><text x="71" y="499" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">treatable</text><path d="M 466 210 Q 478 196 496 204 Q 513 197 530 205 L 787 203 Q 828 209 820 241 L 818 530 Q 812 561 783 556 L 483 558 Q 444 554 450 520 L 452 241 Q 446 215 466 210 Z" fill="#f5efff" stroke="#24162b" stroke-width="4.2" stroke-linejoin="round"/><path d="M 466 209 Q 488 199 510 208 Q 530 200 549 208 L 798 208 Q 824 211 820 255 L 453 255 Q 446 223 466 209 Z" fill="#bfa8f5" stroke="#24162b" stroke-width="2.8" stroke-linejoin="round"/><path d="M797 223 L801 232 L811 236 L801 240 L797 250 L793 240 L783 236 L793 232Z" fill="#ffe24d" stroke="#24162b" stroke-width="2.5"/><text x="474" y="240" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="800" fill="#20152a">Exposure Assessment</text><circle cx="472" cy="273" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M467 273 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="491" y="279" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Ask which agent the</text><text x="491" y="302" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">person encountered</text><circle cx="472" cy="326" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M467 326 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="491" y="332" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Determine how long</text><text x="491" y="355" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">exposure occurred</text><circle cx="472" cy="379" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M467 379 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="491" y="385" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Compare the exposure</text><text x="491" y="408" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">timeline with symptom</text><text x="491" y="431" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">onset</text><circle cx="472" cy="455" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M467 455 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="491" y="461" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Assess whether the</text><text x="491" y="484" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">symptoms fit the</text><text x="491" y="507" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">exposure history</text><path d="M 47 599 Q 59 580 77 588 Q 94 581 111 589 L 368 587 Q 409 593 401 625 L 399 947 Q 393 978 364 973 L 64 975 Q 25 971 31 937 L 33 625 Q 27 599 47 599 Z" fill="#f0fae7" stroke="#24162b" stroke-width="4.2" stroke-linejoin="round"/><path d="M 47 593 Q 69 583 91 592 Q 111 584 130 592 L 379 592 Q 405 595 401 639 L 34 639 Q 27 607 47 593 Z" fill="#abe58e" stroke="#24162b" stroke-width="2.8" stroke-linejoin="round"/><path d="M378 607 L382 616 L392 620 L382 624 L378 634 L374 624 L364 620 L374 616Z" fill="#ffe24d" stroke="#24162b" stroke-width="2.5"/><text x="55" y="624" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="800" fill="#20152a">Prevention</text><circle cx="53" cy="657" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M48 657 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="663" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Reduce or eliminate</text><text x="72" y="686" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">exposure when possible</text><circle cx="53" cy="710" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M48 710 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="716" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Use protective gear and</text><text x="72" y="739" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">devices</text><circle cx="53" cy="763" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M48 763 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="769" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Support health education</text><text x="72" y="792" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">about prevention of lung</text><text x="72" y="815" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">injury</text><circle cx="53" cy="839" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M48 839 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="845" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Workplace controls and</text><text x="72" y="868" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">prevention are key</text><text x="72" y="891" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">themes in the slides</text><path d="M 438 578 Q 450 569 468 577 Q 485 570 502 578 L 787 576 Q 828 582 820 614 L 818 948 Q 812 979 783 974 L 455 976 Q 416 972 422 938 L 424 614 Q 418 588 438 578 Z" fill="#fff8d9" stroke="#24162b" stroke-width="4.2" stroke-linejoin="round"/><path d="M 438 582 Q 460 572 482 581 Q 502 573 521 581 L 798 581 Q 824 584 820 628 L 425 628 Q 418 596 438 582 Z" fill="#ffd962" stroke="#24162b" stroke-width="2.8" stroke-linejoin="round"/><path d="M797 596 L801 605 L811 609 L801 613 L797 623 L793 613 L783 609 L793 605Z" fill="#ffe24d" stroke="#24162b" stroke-width="2.5"/><text x="446" y="613" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="800" fill="#20152a">Nursing Role</text><circle cx="444" cy="646" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M439 646 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="463" y="652" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Serve as an employee</text><text x="463" y="675" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">advocate</text><circle cx="444" cy="699" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M439 699 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="463" y="705" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Provide education about</text><text x="463" y="728" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">preventive measures</text><circle cx="444" cy="752" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M439 752 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="463" y="758" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Document exposure history</text><text x="463" y="781" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">and related assessment</text><text x="463" y="804" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">findings</text><circle cx="444" cy="828" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M439 828 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="463" y="834" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Support follow-up and</text><text x="463" y="857" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">symptom management through</text><text x="463" y="880" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">the care team</text><path d="M28 1015 Q39 1006 52 1014 Q66 1005 78 1014 L770 1014 Q783 1006 796 1014 Q809 1006 821 1019 L821 1067 Q808 1078 796 1070 Q781 1079 768 1070 L79 1070 Q65 1079 51 1070 Q38 1079 28 1068Z" fill="#f6eaff" stroke="#24162b" stroke-width="3.5"/><text x="48" y="1040" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="700" fill="#4d3e51">Source: Hinkle Chapter 19, slides 54-55</text><text x="790" y="1055" text-anchor="end" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="900" fill="#713a7d">19/25</text></svg>