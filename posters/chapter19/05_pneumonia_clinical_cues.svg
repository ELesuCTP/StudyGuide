<path d="M24 26 Q35 16 49 24 Q60 14 73 24 L777 24 Q790 16 803 25 Q818 17 826 31 L826 168 Q814 179 801 171 Q787 181 772 171 L79 171 Q64 182 49 172 Q35 181 24 168Z" fill="#fff2a0" stroke="#24162b" stroke-width="4"/>
<text x="208" y="46" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="900" letter-spacing="2" fill="#713a7d">CHAPTER 19  •  MED-SURG I</text>
<g stroke="#24162b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
      <path d="M57 102 Q60 58 103 59 Q144 60 150 103 Q137 86 121 83 Q100 104 65 99Z" fill="#8f4d2d"/>
      <circle cx="104" cy="101" r="39" fill="#ffd4b3"/>
      <path d="M66 91 Q72 59 103 58 Q137 60 147 94 Q127 82 119 79 Q97 98 66 91Z" fill="#8f4d2d"/>
      <circle cx="91" cy="105" r="3.5" fill="#21152c"/><circle cx="118" cy="105" r="3.5" fill="#21152c"/>
      <path d="M96 120 Q104 128 112 120" fill="none"/><path d="M88 63 Q103 40 121 62 L117 71 L93 71Z" fill="#fff"/>
      <path d="M101 54 L106 43 L112 54Z" fill="#e74f91"/><path d="M71 149 Q103 128 136 150 L146 206 L62 206Z" fill="#a98af2"/>
      <path d="M84 153 Q84 178 102 183 Q121 177 121 153" fill="none" stroke="#cf2780" stroke-width="5"/>
      <path d="M102 183 L102 195" fill="none" stroke="#cf2780" stroke-width="5"/>
    </g><g stroke="#24162b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
      <path d="M724 54 L724 102 M724 79 L697 104 M724 79 L751 104" fill="none"/>
      <path d="M695 91 Q672 94 665 122 L658 164 Q656 186 676 187 Q703 188 713 161 L720 119 L720 98Z" fill="#ff9bc7"/>
      <path d="M753 91 Q776 94 783 122 L790 164 Q792 186 772 187 Q745 188 735 161 L728 119 L728 98Z" fill="#9de4ee"/>
      <path d="M724 101 L724 156 M724 116 L701 140 M724 116 L747 140" fill="none"/>
      <path d="M648 75 L653 62 M651 69 L638 69 M797 75 L792 62 M794 69 L807 69" fill="none" stroke="#ffd42e"/>
    </g><text x="208" y="91" font-family="DejaVu Sans,sans-serif" font-size="40" font-weight="900" fill="#3a1246" stroke="#fff" stroke-width="5" paint-order="stroke">Pneumonia Clinical Cues</text><text x="210" y="144" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#25152b">Findings vary with organism, severity, and</text><text x="210" y="163" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#25152b">underlying illness</text><path d="M194 32 L198 41 L208 45 L198 49 L194 59 L190 49 L180 45 L190 41Z" fill="#ffd52d" stroke="#24162b" stroke-width="2.5"/><path d="M 46 194 Q 58 185 76 193 Q 93 186 110 194 L 373 192 Q 414 198 406 230 L 404 512 Q 398 543 369 538 L 63 540 Q 24 536 30 502 L 32 230 Q 26 204 46 194 Z" fill="#e9f1ff" stroke="#24162b" stroke-width="4.2" stroke-linejoin="round"/><path d="M 46 198 Q 68 188 90 197 Q 110 189 129 197 L 384 197 Q 410 200 406 244 L 33 244 Q 26 212 46 198 Z" fill="#a9c9ff" stroke="#24162b" stroke-width="2.8" stroke-linejoin="round"/><path d="M383 212 L387 221 L397 225 L387 229 L383 239 L379 229 L369 225 L379 221Z" fill="#ffe24d" stroke="#24162b" stroke-width="2.5"/><text x="54" y="221" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="800" fill="#20152a">Possible</text><text x="54" y="243" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="800" fill="#20152a">Manifestations</text><circle cx="52" cy="272" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 272 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="278" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">Streptococcal pneumonia may begin</text><text x="71" y="294" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">suddenly with chills, fever, pleuritic</text><text x="71" y="310" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">pain, tachypnea, and respiratory</text><text x="71" y="326" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">distress</text><circle cx="52" cy="343" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 343 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="349" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">Viral, Mycoplasma, or Legionella</text><text x="71" y="365" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">pneumonia may show relative</text><text x="71" y="381" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">bradycardia</text><circle cx="52" cy="398" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 398 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="404" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">Other findings can include URI</text><text x="71" y="420" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">symptoms, headache, low-grade fever,</text><text x="71" y="436" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">myalgia, rash, or pharyngitis</text><circle cx="52" cy="453" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 453 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="459" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">Orthopnea, crackles, increased tactile</text><text x="71" y="475" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">fremitus, and purulent sputum may</text><text x="71" y="491" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">occur</text><path d="M 448 207 Q 460 193 478 201 Q 495 194 512 202 L 785 200 Q 826 206 818 238 L 816 502 Q 810 533 781 528 L 465 530 Q 426 526 432 492 L 434 238 Q 428 212 448 207 Z" fill="#e8faff" stroke="#24162b" stroke-width="4.2" stroke-linejoin="round"/><path d="M 448 206 Q 470 196 492 205 Q 512 197 531 205 L 796 205 Q 822 208 818 252 L 435 252 Q 428 220 448 206 Z" fill="#86dfeb" stroke="#24162b" stroke-width="2.8" stroke-linejoin="round"/><path d="M795 220 L799 229 L809 233 L799 237 L795 247 L791 237 L781 233 L791 229Z" fill="#ffe24d" stroke="#24162b" stroke-width="2.5"/><text x="456" y="229" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="800" fill="#20152a">Assess the Whole</text><text x="456" y="251" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="800" fill="#20152a">Patient</text><circle cx="454" cy="280" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M449 280 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="473" y="286" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">Trend vital signs, cough</text><text x="473" y="304" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">frequency and severity, and</text><text x="473" y="322" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">shortness of breath</text><circle cx="454" cy="341" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M449 341 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="473" y="347" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">Describe secretions by amount,</text><text x="473" y="365" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">odor, and color</text><circle cx="454" cy="384" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M449 384 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="473" y="390" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">Inspect and auscultate the chest;</text><text x="473" y="408" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">note oxygenation and work of</text><text x="473" y="426" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">breathing</text><circle cx="454" cy="445" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M449 445 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="473" y="451" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">Assess mental status, fatigue,</text><text x="473" y="469" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">edema, hydration, intake, and</text><text x="473" y="487" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">coexisting heart failure</text><path d="M 46 574 Q 58 555 76 563 Q 93 556 110 564 L 383 562 Q 424 568 416 600 L 414 952 Q 408 983 379 978 L 63 980 Q 24 976 30 942 L 32 600 Q 26 574 46 574 Z" fill="#fff0f6" stroke="#24162b" stroke-width="4.2" stroke-linejoin="round"/><path d="M 46 568 Q 68 558 90 567 Q 110 559 129 567 L 394 567 Q 420 570 416 614 L 33 614 Q 26 582 46 568 Z" fill="#f39dd0" stroke="#24162b" stroke-width="2.8" stroke-linejoin="round"/><path d="M393 582 L397 591 L407 595 L397 599 L393 609 L389 599 L379 595 L389 591Z" fill="#ffe24d" stroke="#24162b" stroke-width="2.5"/><text x="54" y="599" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="800" fill="#20152a">Older-Adult Watch</text><circle cx="52" cy="632" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 632 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="638" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">New mental-status changes</text><text x="71" y="661" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">may accompany pneumonia</text><circle cx="52" cy="685" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 685 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="691" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Also monitor fatigue,</text><text x="71" y="714" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">dehydration, edema, and</text><text x="71" y="737" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">functional change</text><circle cx="52" cy="761" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 761 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="767" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Atypical or subtle</text><text x="71" y="790" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">findings do not rule out</text><text x="71" y="813" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">serious infection</text><circle cx="52" cy="837" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 837 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="843" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Compare with baseline and</text><text x="71" y="866" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">report concerning change</text><text x="71" y="889" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">promptly</text><path d="M 458 549 Q 470 540 488 548 Q 505 541 522 549 L 785 547 Q 826 553 818 585 L 816 952 Q 810 983 781 978 L 475 980 Q 436 976 442 942 L 444 585 Q 438 559 458 549 Z" fill="#f5efff" stroke="#24162b" stroke-width="4.2" stroke-linejoin="round"/><path d="M 458 553 Q 480 543 502 552 Q 522 544 541 552 L 796 552 Q 822 555 818 599 L 445 599 Q 438 567 458 553 Z" fill="#bfa8f5" stroke="#24162b" stroke-width="2.8" stroke-linejoin="round"/><path d="M795 567 L799 576 L809 580 L799 584 L795 594 L791 584 L781 580 L791 576Z" fill="#ffe24d" stroke="#24162b" stroke-width="2.5"/><text x="466" y="584" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="800" fill="#20152a">Diagnostic Workup</text><circle cx="464" cy="617" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M459 617 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="483" y="623" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">History and physical</text><text x="483" y="646" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">examination</text><circle cx="464" cy="670" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M459 670 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="483" y="676" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Chest X-ray</text><circle cx="464" cy="700" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M459 700 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="483" y="706" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Blood cultures and sputum</text><text x="483" y="729" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">examination when ordered</text><circle cx="464" cy="753" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M459 753 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="483" y="759" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Bronchoscopy may be used</text><text x="483" y="782" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">for acute severe</text><text x="483" y="805" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">infection</text><path d="M28 1015 Q39 1006 52 1014 Q66 1005 78 1014 L770 1014 Q783 1006 796 1014 Q809 1006 821 1019 L821 1067 Q808 1078 796 1070 Q781 1079 768 1070 L79 1070 Q65 1079 51 1070 Q38 1079 28 1068Z" fill="#f6eaff" stroke="#24162b" stroke-width="3.5"/><text x="48" y="1040" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="700" fill="#4d3e51">Source: Hinkle Chapter 19, slides 15-16 and 20</text><text x="790" y="1055" text-anchor="end" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="900" fill="#713a7d">05/25</text></svg>