    </g><text x="208" y="71" font-family="DejaVu Sans,sans-serif" font-size="27" font-weight="900" fill="#3a1246" stroke="#fff" stroke-width="5" paint-order="stroke">Chapter 19 Antibiotic</text><text x="208" y="100" font-family="DejaVu Sans,sans-serif" font-size="27" font-weight="900" fill="#3a1246" stroke="#fff" stroke-width="5" paint-order="stroke">Guide</text><text x="210" y="148" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#25152b">Drug examples from the supplied NU2106 and</text><text x="210" y="167" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#25152b">Chapter 9 Word documents</text><path d="M194 32 L198 41 L208 45 L198 49 L194 59 L190 49 L180 45 L190 41Z" fill="#ffd52d" stroke="#24162b" stroke-width="2.5"/><path d="M 46 194 Q 58 185 76 193 Q 93 186 110 194 L 391 192 Q 432 198 424 230 L 422 536 Q 416 567 387 562 L 63 564 Q 24 560 30 526 L 32 230 Q 26 204 46 194 Z" fill="#fff8d9" stroke="#24162b" stroke-width="4.2" stroke-linejoin="round"/><path d="M 46 198 Q 68 188 90 197 Q 110 189 129 197 L 402 197 Q 428 200 424 244 L 33 244 Q 26 212 46 198 Z" fill="#ffd962" stroke="#24162b" stroke-width="2.8" stroke-linejoin="round"/><path d="M401 212 L405 221 L415 225 L405 229 L401 239 L397 229 L387 225 L397 221Z" fill="#ffe24d" stroke="#24162b" stroke-width="2.5"/><text x="54" y="221" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="800" fill="#20152a">Community-Acquired</text><text x="54" y="243" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="800" fill="#20152a">Pneumonia</text><circle cx="52" cy="272" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 272 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="278" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">Course examples: amoxicillin,</text><text x="71" y="294" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">amoxicillin-clavulanate, azithromycin,</text><text x="71" y="310" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">doxycycline, or ceftriaxone</text><circle cx="52" cy="327" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 327 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="333" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">Clarithromycin is also named in the</text><text x="71" y="349" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">supplied Chapter 9 review as a macrolide</text><text x="71" y="365" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">example</text><circle cx="52" cy="382" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 382 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="388" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">Drug selection depends on the infection,</text><text x="71" y="404" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">patient risks, allergies, cultures, and</text><text x="71" y="420" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">prescriber plan</text><circle cx="52" cy="437" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 437 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="443" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">These are examples from the supplied</text><text x="71" y="459" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">review, not a universal regimen</text><circle cx="52" cy="476" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 476 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="482" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">The Chapter 9 review also names</text><text x="71" y="498" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">clarithromycin; match drug to indication</text><text x="71" y="514" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">and current guidance</text><path d="M 466 210 Q 478 196 496 204 Q 513 197 530 205 L 787 203 Q 828 209 820 241 L 818 530 Q 812 561 783 556 L 483 558 Q 444 554 450 520 L 452 241 Q 446 215 466 210 Z" fill="#e9f1ff" stroke="#24162b" stroke-width="4.2" stroke-linejoin="round"/><path d="M 466 209 Q 488 199 510 208 Q 530 200 549 208 L 798 208 Q 824 211 820 255 L 453 255 Q 446 223 466 209 Z" fill="#a9c9ff" stroke="#24162b" stroke-width="2.8" stroke-linejoin="round"/><path d="M797 223 L801 232 L811 236 L801 240 L797 250 L793 240 L783 236 L793 232Z" fill="#ffe24d" stroke="#24162b" stroke-width="2.5"/><text x="474" y="240" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="800" fill="#20152a">HAP and VAP Examples</text><circle cx="472" cy="273" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M467 273 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="491" y="279" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">Broader options named:</text><text x="491" y="299" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">piperacillin-tazobactam,</text><text x="491" y="319" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">cefepime, vancomycin, or</text><text x="491" y="339" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">meropenem</text><circle cx="472" cy="360" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M467 360 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="491" y="366" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">Selection depends on organism</text><text x="491" y="386" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">and resistance risk</text><circle cx="472" cy="407" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M467 407 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="491" y="413" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">Review cultures and narrow or</text><text x="491" y="433" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">change therapy as directed</text><circle cx="472" cy="454" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M467 454 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="491" y="460" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">Do not treat the list as a</text><text x="491" y="480" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">fixed combination or</text><text x="491" y="500" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">automatic bundle</text><path d="M 47 599 Q 59 580 77 588 Q 94 581 111 589 L 368 587 Q 409 593 401 625 L 399 947 Q 393 978 364 973 L 64 975 Q 25 971 31 937 L 33 625 Q 27 599 47 599 Z" fill="#e8faff" stroke="#24162b" stroke-width="4.2" stroke-linejoin="round"/><path d="M 47 593 Q 69 583 91 592 Q 111 584 130 592 L 379 592 Q 405 595 401 639 L 34 639 Q 27 607 47 593 Z" fill="#86dfeb" stroke="#24162b" stroke-width="2.8" stroke-linejoin="round"/><path d="M378 607 L382 616 L392 620 L382 624 L378 634 L374 624 L364 620 L374 616Z" fill="#ffe24d" stroke="#24162b" stroke-width="2.5"/><text x="55" y="616" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="800" fill="#20152a">Abscess, Aspiration,</text><text x="55" y="638" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="800" fill="#20152a">and Empyema</text><circle cx="53" cy="667" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M48 667 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="673" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">Ampicillin-sulbactam or</text><text x="72" y="689" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">amoxicillin-clavulanate are course</text><text x="72" y="705" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">examples when anaerobes may be</text><text x="72" y="721" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">involved in lung abscess or</text><text x="72" y="737" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">aspiration-related bacterial</text><text x="72" y="753" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">infection</text><circle cx="53" cy="770" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M48 770 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="776" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">Empyema therapy is guided by source</text><text x="72" y="792" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">and cultures; broad IV therapy may</text><text x="72" y="808" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">start while cultures are pending</text><circle cx="53" cy="825" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M48 825 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="831" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">The slide set specifies antibiotics</text><text x="72" y="847" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">for 4-6 weeks for empyema</text><circle cx="53" cy="864" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M48 864 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="870" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">Drainage and treatment of the</text><text x="72" y="886" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">underlying source are also important</text><path d="M 438 578 Q 450 569 468 577 Q 485 570 502 578 L 787 576 Q 828 582 820 614 L 818 948 Q 812 979 783 974 L 455 976 Q 416 972 422 938 L 424 614 Q 418 588 438 578 Z" fill="#fff0f6" stroke="#24162b" stroke-width="4.2" stroke-linejoin="round"/><path d="M 438 582 Q 460 572 482 581 Q 502 573 521 581 L 798 581 Q 824 584 820 628 L 425 628 Q 418 596 438 582 Z" fill="#f39dd0" stroke="#24162b" stroke-width="2.8" stroke-linejoin="round"/><path d="M797 596 L801 605 L811 609 L801 613 L797 623 L793 613 L783 609 L793 605Z" fill="#ffe24d" stroke="#24162b" stroke-width="2.5"/><text x="446" y="613" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="800" fill="#20152a">Tuberculosis</text><circle cx="444" cy="646" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M439 646 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="463" y="652" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Classic RIPE: rifampin,</text><text x="463" y="675" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">isoniazid, pyrazinamide,</text><text x="463" y="698" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">and ethambutol</text><circle cx="444" cy="722" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M439 722 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="463" y="728" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">The Chapter 9 review also</text><text x="463" y="751" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">names rifapentine</text><circle cx="444" cy="775" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M439 775 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="463" y="781" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">TB is not treated with one</text><text x="463" y="804" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">antibiotic; multidrug</text><text x="463" y="827" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">adherence is essential</text><circle cx="444" cy="851" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M439 851 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="463" y="857" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">CDC currently offers</text><text x="463" y="880" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">shorter regimens for</text><text x="463" y="903" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">eligible patients; the TB</text><text x="463" y="926" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">team selects the regimen</text><path d="M28 1015 Q39 1006 52 1014 Q66 1005 78 1014 L770 1014 Q783 1006 796 1014 Q809 1006 821 1019 L821 1067 Q808 1078 796 1070 Q781 1079 768 1070 L79 1070 Q65 1079 51 1070 Q38 1079 28 1068Z" fill="#f6eaff" stroke="#24162b" stroke-width="3.5"/><text x="48" y="1040" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="700" fill="#4d3e51">Source: NU2106 Exam 4 Chapter 19 Antibiotics.docx; Antibiotics To Review Over For Chapter 9</text><text x="48" y="1055" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="700" fill="#4d3e51">Antibiotics.docx</text><text x="790" y="1055" text-anchor="end" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="900" fill="#713a7d">22/25</text></svg>