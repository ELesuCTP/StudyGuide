="71" y="574" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">arterial pressure above 30 mm</text><text x="71" y="597" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Hg with heart failure</text><circle cx="52" cy="621" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 621 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="627" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Cor pulmonale is listed as a</text><text x="71" y="650" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">related topic</text><circle cx="52" cy="674" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 674 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="680" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Use your lecture or textbook</text><text x="71" y="703" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">for the full definition and</text><text x="71" y="726" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">diagnostic criteria</text><circle cx="52" cy="750" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 750 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="756" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Do not use this slide alone</text><text x="71" y="779" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">to diagnose a patient</text><path d="M 488 487 Q 500 468 518 476 Q 535 469 552 477 L 783 475 Q 824 481 816 513 L 814 955 Q 808 986 779 981 L 505 983 Q 466 979 472 945 L 474 513 Q 468 487 488 487 Z" fill="#f5efff" stroke="#24162b" stroke-width="4.2" stroke-linejoin="round"/><path d="M 488 481 Q 510 471 532 480 Q 552 472 571 480 L 794 480 Q 820 483 816 527 L 475 527 Q 468 495 488 481 Z" fill="#bfa8f5" stroke="#24162b" stroke-width="2.8" stroke-linejoin="round"/><path d="M793 495 L797 504 L807 508 L797 512 L793 522 L789 512 L779 508 L789 504Z" fill="#ffe24d" stroke="#24162b" stroke-width="2.5"/><text x="496" y="512" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="800" fill="#20152a">Study Focus</text><circle cx="494" cy="545" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M489 545 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="513" y="551" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">Review the cause and</text><text x="513" y="572" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">expected effect on</text><text x="513" y="593" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">oxygenation or</text><text x="513" y="614" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">right-heart workload from</text><text x="513" y="635" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">your assigned source</text><circle cx="494" cy="657" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M489 657 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="513" y="663" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">Connect new dyspnea or</text><text x="513" y="684" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">oxygenation changes to</text><text x="513" y="705" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">prompt assessment</text><circle cx="494" cy="727" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M489 727 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="513" y="733" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">Know the ordered</text><text x="513" y="754" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">diagnostic and treatment</text><text x="513" y="775" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">plan for each disorder</text><circle cx="494" cy="797" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M489 797 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="513" y="803" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">The Chapter 19 slide text</text><text x="513" y="824" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">supplied here does not</text><text x="513" y="845" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">provide drug names or a</text><text x="513" y="866" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">full management plan</text><path d="M28 1015 Q39 1006 52 1014 Q66 1005 78 1014 L770 1014 Q783 1006 796 1014 Q809 1006 821 1019 L821 1067 Q808 1078 796 1070 Q781 1079 768 1070 L79 1070 Q65 1079 51 1070 Q38 1079 28 1068Z" fill="#f6eaff" stroke="#24162b" stroke-width="3.5"/><text x="48" y="1040" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="700" fill="#4d3e51">Source: Hinkle Chapter 19, slides 50-53</text><text x="790" y="1055" text-anchor="end" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="900" fill="#713a7d">18/25</text></svg>