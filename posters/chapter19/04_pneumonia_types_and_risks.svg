    </g><text x="208" y="91" font-family="DejaVu Sans,sans-serif" font-size="40" font-weight="900" fill="#3a1246" stroke="#fff" stroke-width="5" paint-order="stroke">Pneumonia Types and Risks</text><text x="210" y="144" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#25152b">Infection and inflammation of lung parenchyma</text><path d="M194 32 L198 41 L208 45 L198 49 L194 59 L190 49 L180 45 L190 41Z" fill="#ffd52d" stroke="#24162b" stroke-width="2.5"/><path d="M 46 194 Q 58 185 76 193 Q 93 186 110 194 L 391 192 Q 432 198 424 230 L 422 536 Q 416 567 387 562 L 63 564 Q 24 560 30 526 L 32 230 Q 26 204 46 194 Z" fill="#fff8d9" stroke="#24162b" stroke-width="4.2" stroke-linejoin="round"/><path d="M 46 198 Q 68 188 90 197 Q 110 189 129 197 L 402 197 Q 428 200 424 244 L 33 244 Q 26 212 46 198 Z" fill="#ffd962" stroke="#24162b" stroke-width="2.8" stroke-linejoin="round"/><path d="M401 212 L405 221 L415 225 L405 229 L401 239 L397 229 L387 225 L397 221Z" fill="#ffe24d" stroke="#24162b" stroke-width="2.5"/><text x="54" y="221" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="800" fill="#20152a">Causes and</text><text x="54" y="243" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="800" fill="#20152a">Categories</text><circle cx="52" cy="272" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 272 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="278" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">Possible causes include bacteria,</text><text x="71" y="294" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">mycobacteria, fungi, and viruses</text><circle cx="52" cy="311" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 311 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="317" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">The slides list community-acquired,</text><text x="71" y="333" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">health care-associated,</text><text x="71" y="349" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">hospital-acquired, and</text><text x="71" y="365" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">ventilator-associated pneumonia</text><circle cx="52" cy="382" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 382 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="388" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">The lecture notes that health</text><text x="71" y="404" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">care-associated pneumonia may involve</text><text x="71" y="420" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">multidrug-resistant organisms and needs</text><text x="71" y="436" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">early recognition</text><circle cx="52" cy="453" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 453 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="459" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">HAP develops 48 hours or more after</text><text x="71" y="475" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">hospitalization; VAP follows at least 48</text><text x="71" y="491" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">hours of ventilation</text><circle cx="52" cy="508" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 508 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="514" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">Immunocompromised patients may have</text><text x="71" y="530" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">subtle onset and progressive dyspnea,</text><text x="71" y="546" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">fever, and a dry cough</text><path d="M 466 210 Q 478 196 496 204 Q 513 197 530 205 L 787 203 Q 828 209 820 241 L 818 530 Q 812 561 783 556 L 483 558 Q 444 554 450 520 L 452 241 Q 446 215 466 210 Z" fill="#e9f1ff" stroke="#24162b" stroke-width="4.2" stroke-linejoin="round"/><path d="M 466 209 Q 488 199 510 208 Q 530 200 549 208 L 798 208 Q 824 211 820 255 L 453 255 Q 446 223 466 209 Z" fill="#a9c9ff" stroke="#24162b" stroke-width="2.8" stroke-linejoin="round"/><path d="M797 223 L801 232 L811 236 L801 240 L797 250 L793 240 L783 236 L793 232Z" fill="#ffe24d" stroke="#24162b" stroke-width="2.5"/><text x="474" y="240" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="800" fill="#20152a">Community-Acquired</text><circle cx="472" cy="273" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M467 273 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="491" y="279" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">Occurs in the community or</text><text x="491" y="300" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">within the first 48 hours</text><text x="491" y="321" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">after hospitalization</text><circle cx="472" cy="343" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M467 343 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="491" y="349" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">The slide set identifies</text><text x="491" y="370" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">Streptococcus pneumoniae as</text><text x="491" y="391" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">a common adult cause</text><circle cx="472" cy="413" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M467 413 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="491" y="419" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">Infection rates rise with</text><text x="491" y="440" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">age</text><circle cx="472" cy="462" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M467 462 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="491" y="468" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">Viral causes are common in</text><text x="491" y="489" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">infants and children</text><path d="M 47 599 Q 59 580 77 588 Q 94 581 111 589 L 368 587 Q 409 593 401 625 L 399 947 Q 393 978 364 973 L 64 975 Q 25 971 31 937 L 33 625 Q 27 599 47 599 Z" fill="#e8faff" stroke="#24162b" stroke-width="4.2" stroke-linejoin="round"/><path d="M 47 593 Q 69 583 91 592 Q 111 584 130 592 L 379 592 Q 405 595 401 639 L 34 639 Q 27 607 47 593 Z" fill="#86dfeb" stroke="#24162b" stroke-width="2.8" stroke-linejoin="round"/><path d="M378 607 L382 616 L392 620 L382 624 L378 634 L374 624 L364 620 L374 616Z" fill="#ffe24d" stroke="#24162b" stroke-width="2.5"/><text x="55" y="616" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="800" fill="#20152a">Risk Factors from</text><text x="55" y="638" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="800" fill="#20152a">the Slides</text><circle cx="53" cy="667" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M48 667 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="673" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">Heart failure, diabetes,</text><text x="72" y="693" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">alcoholism, COPD, AIDS, and</text><text x="72" y="713" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">cystic fibrosis</text><circle cx="53" cy="734" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M48 734 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="740" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">Influenza and other</text><text x="72" y="760" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">respiratory infections</text><circle cx="53" cy="781" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M48 781 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="787" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">Debility, dehydration,</text><text x="72" y="807" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">impaired cough, or immune</text><text x="72" y="827" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">suppression may increase</text><text x="72" y="847" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">vulnerability</text><circle cx="53" cy="868" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M48 868 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="874" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">HAP can involve</text><text x="72" y="894" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">multidrug-resistant</text><text x="72" y="914" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">organisms; prevention and</text><text x="72" y="934" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" fill="#201b2a">early recognition matter</text><path d="M 438 578 Q 450 569 468 577 Q 485 570 502 578 L 787 576 Q 828 582 820 614 L 818 948 Q 812 979 783 974 L 455 976 Q 416 972 422 938 L 424 614 Q 418 588 438 578 Z" fill="#fff0f6" stroke="#24162b" stroke-width="4.2" stroke-linejoin="round"/><path d="M 438 582 Q 460 572 482 581 Q 502 573 521 581 L 798 581 Q 824 584 820 628 L 425 628 Q 418 596 438 582 Z" fill="#f39dd0" stroke="#24162b" stroke-width="2.8" stroke-linejoin="round"/><path d="M797 596 L801 605 L811 609 L801 613 L797 623 L793 613 L783 609 L793 605Z" fill="#ffe24d" stroke="#24162b" stroke-width="2.5"/><text x="446" y="605" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="800" fill="#20152a">HAP, VAP, and Immune</text><text x="446" y="627" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="800" fill="#20152a">Suppression</text><circle cx="444" cy="656" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M439 656 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="463" y="662" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">HAP begins at least 48 hours</text><text x="463" y="683" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">after admission and has high</text><text x="463" y="704" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">mortality in the slide set</text><circle cx="444" cy="726" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M439 726 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="463" y="732" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">HAP may present with fever,</text><text x="463" y="753" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">tachycardia, pleural effusion,</text><text x="463" y="774" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">or scant sputum in debilitated</text><text x="463" y="795" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">patients</text><circle cx="444" cy="817" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M439 817 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="463" y="823" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">VAP prevention is emphasized;</text><text x="463" y="844" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">use the facility&#x27;s VAP bundle</text><circle cx="444" cy="866" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M439 866 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="463" y="872" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">Immunocompromised-host</text><text x="463" y="893" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">examples include Pneumocystis,</text><text x="463" y="914" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">fungi, and tuberculosis</text><path d="M28 1015 Q39 1006 52 1014 Q66 1005 78 1014 L770 1014 Q783 1006 796 1014 Q809 1006 821 1019 L821 1067 Q808 1078 796 1070 Q781 1079 768 1070 L79 1070 Q65 1079 51 1070 Q38 1079 28 1068Z" fill="#f6eaff" stroke="#24162b" stroke-width="3.5"/><text x="48" y="1040" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="700" fill="#4d3e51">Source: Hinkle Chapter 19, slides 10-14</text><text x="790" y="1055" text-anchor="end" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="900" fill="#713a7d">04/25</text></svg>