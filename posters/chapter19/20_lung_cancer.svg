    </g><text x="208" y="91" font-family="DejaVu Sans,sans-serif" font-size="40" font-weight="900" fill="#3a1246" stroke="#fff" stroke-width="5" paint-order="stroke">Lung Cancer</text><text x="210" y="144" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#25152b">Often has no symptoms until later disease</text><text x="210" y="163" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#25152b">stages</text><path d="M194 32 L198 41 L208 45 L198 49 L194 59 L190 49 L180 45 L190 41Z" fill="#ffd52d" stroke="#24162b" stroke-width="2.5"/><path d="M 46 194 Q 58 185 76 193 Q 93 186 110 194 L 373 192 Q 414 198 406 230 L 404 512 Q 398 543 369 538 L 63 540 Q 24 536 30 502 L 32 230 Q 26 204 46 194 Z" fill="#f5efff" stroke="#24162b" stroke-width="4.2" stroke-linejoin="round"/><path d="M 46 198 Q 68 188 90 197 Q 110 189 129 197 L 384 197 Q 410 200 406 244 L 33 244 Q 26 212 46 198 Z" fill="#bfa8f5" stroke="#24162b" stroke-width="2.8" stroke-linejoin="round"/><path d="M383 212 L387 221 L397 225 L387 229 L383 239 L379 229 L369 225 L379 221Z" fill="#ffe24d" stroke="#24162b" stroke-width="2.5"/><text x="54" y="221" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="800" fill="#20152a">Risk and</text><text x="54" y="243" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="800" fill="#20152a">Classification</text><circle cx="52" cy="272" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 272 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="278" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">The lecture identifies lung cancer as</text><text x="71" y="294" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">a leading cause of cancer death in the</text><text x="71" y="310" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">United States</text><circle cx="52" cy="327" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 327 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="333" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">More than 85 percent is attributed to</text><text x="71" y="349" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">cigarette smoke in the slide set</text><circle cx="52" cy="366" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 366 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="372" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">The slides list small-cell and</text><text x="71" y="388" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">non-small-cell categories</text><circle cx="52" cy="405" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 405 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="411" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">Slide estimates: 13 percent small-cell</text><text x="71" y="427" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">and 84 percent non-small-cell tumors</text><circle cx="52" cy="444" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 444 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="450" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">Stage reflects tumor size, location,</text><text x="71" y="466" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">lymph-node involvement, and metastasis</text><path d="M 448 207 Q 460 193 478 201 Q 495 194 512 202 L 785 200 Q 826 206 818 238 L 816 502 Q 810 533 781 528 L 465 530 Q 426 526 432 492 L 434 238 Q 428 212 448 207 Z" fill="#f0fae7" stroke="#24162b" stroke-width="4.2" stroke-linejoin="round"/><path d="M 448 206 Q 470 196 492 205 Q 512 197 531 205 L 796 205 Q 822 208 818 252 L 435 252 Q 428 220 448 206 Z" fill="#abe58e" stroke="#24162b" stroke-width="2.8" stroke-linejoin="round"/><path d="M795 220 L799 229 L809 233 L799 237 L795 247 L791 237 L781 233 L791 229Z" fill="#ffe24d" stroke="#24162b" stroke-width="2.5"/><text x="456" y="229" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="800" fill="#20152a">Treatment Options in</text><text x="456" y="251" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="800" fill="#20152a">the Slides</text><circle cx="454" cy="280" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M449 280 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="473" y="286" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">Surgery and radiation</text><circle cx="454" cy="308" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M449 308 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="473" y="314" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">Chemotherapy and</text><text x="473" y="335" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">immunotherapy</text><circle cx="454" cy="357" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M449 357 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="473" y="363" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">Treatment depends on tumor</text><text x="473" y="384" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">type and stage</text><circle cx="454" cy="406" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M449 406 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="473" y="412" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">Nurse navigators and</text><text x="473" y="433" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">palliative care may support</text><text x="473" y="454" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">the patient through treatment</text><path d="M 46 574 Q 58 555 76 563 Q 93 556 110 564 L 383 562 Q 424 568 416 600 L 414 952 Q 408 983 379 978 L 63 980 Q 24 976 30 942 L 32 600 Q 26 574 46 574 Z" fill="#fff8d9" stroke="#24162b" stroke-width="4.2" stroke-linejoin="round"/><path d="M 46 568 Q 68 558 90 567 Q 110 559 129 567 L 394 567 Q 420 570 416 614 L 33 614 Q 26 582 46 568 Z" fill="#ffd962" stroke="#24162b" stroke-width="2.8" stroke-linejoin="round"/><path d="M393 582 L397 591 L407 595 L397 599 L393 609 L389 599 L379 595 L389 591Z" fill="#ffe24d" stroke="#24162b" stroke-width="2.5"/><text x="54" y="599" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="800" fill="#20152a">Symptom Management</text><circle cx="52" cy="632" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 632 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="638" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Relieve pain and</text><text x="71" y="661" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">discomfort and prevent</text><text x="71" y="684" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">complications</text><circle cx="52" cy="708" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 708 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="714" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Manage dyspnea, fatigue,</text><text x="71" y="737" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">nausea and vomiting, and</text><text x="71" y="760" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">anorexia</text><circle cx="52" cy="784" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 784 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="790" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Support airway clearance</text><text x="71" y="813" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">and breathing comfort</text><circle cx="52" cy="837" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 837 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="843" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Reduce fatigue and address</text><text x="71" y="866" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">nutrition and function</text><path d="M 458 549 Q 470 540 488 548 Q 505 541 522 549 L 785 547 Q 826 553 818 585 L 816 952 Q 810 983 781 978 L 475 980 Q 436 976 442 942 L 444 585 Q 438 559 458 549 Z" fill="#e9f1ff" stroke="#24162b" stroke-width="4.2" stroke-linejoin="round"/><path d="M 458 553 Q 480 543 502 552 Q 522 544 541 552 L 796 552 Q 822 555 818 599 L 445 599 Q 438 567 458 553 Z" fill="#a9c9ff" stroke="#24162b" stroke-width="2.8" stroke-linejoin="round"/><path d="M795 567 L799 576 L809 580 L799 584 L795 594 L791 584 L781 580 L791 576Z" fill="#ffe24d" stroke="#24162b" stroke-width="2.5"/><text x="466" y="576" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="800" fill="#20152a">Whole-Person Nursing</text><text x="466" y="598" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="800" fill="#20152a">Care</text><circle cx="464" cy="627" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M459 627 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="483" y="633" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Provide psychological</text><text x="483" y="656" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">support</text><circle cx="464" cy="680" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M459 680 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="483" y="686" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Assess distress, goals,</text><text x="483" y="709" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">symptom burden, and</text><text x="483" y="732" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">caregiver needs</text><circle cx="464" cy="756" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M459 756 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="483" y="762" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Coordinate the care team,</text><text x="483" y="785" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">nurse navigation, and</text><text x="483" y="808" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">palliative support</text><circle cx="464" cy="832" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M459 832 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="483" y="838" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Keep comfort and the</text><text x="483" y="861" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">patient&#x27;s priorities</text><text x="483" y="884" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">visible throughout</text><text x="483" y="907" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">treatment</text><path d="M28 1015 Q39 1006 52 1014 Q66 1005 78 1014 L770 1014 Q783 1006 796 1014 Q809 1006 821 1019 L821 1067 Q808 1078 796 1070 Q781 1079 768 1070 L79 1070 Q65 1079 51 1070 Q38 1079 28 1068Z" fill="#f6eaff" stroke="#24162b" stroke-width="3.5"/><text x="48" y="1040" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="700" fill="#4d3e51">Source: Hinkle Chapter 19, slides 56-57</text><text x="790" y="1055" text-anchor="end" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="900" fill="#713a7d">20/25</text></svg>