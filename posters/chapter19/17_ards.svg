<text x="208" y="46" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="900" letter-spacing="2" fill="#713a7d">CHAPTER 19  •  MED-SURG I</text>
<g stroke="#24162b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
      <path d="M57 102 Q60 58 103 59 Q144 60 150 103 Q137 86 121 83 Q100 104 65 99Z" fill="#8f4d2d"/>
      <circle cx="104" cy="101" r="39" fill="#ffd4b3"/>
      <path d="M66 91 Q72 59 103 58 Q137 60 147 94 Q127 82 119 79 Q97 98 66 91Z" fill="#8f4d2d"/>
      <circle cx="91" cy="105" r="3.5" fill="#21152c"/><circle cx="118" cy="105" r="3.5" fill="#21152c"/>
      <path d="M96 120 Q104 128 112 120" fill="none"/><path d="M88 63 Q103 40 121 62 L117 71 L93 71Z" fill="#fff"/>
