    </g><text x="208" y="91" font-family="DejaVu Sans,sans-serif" font-size="40" font-weight="900" fill="#3a1246" stroke="#fff" stroke-width="5" paint-order="stroke">ARDS</text><text x="210" y="144" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#25152b">Acute Respiratory Distress Syndrome causes</text><text x="210" y="163" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#25152b">sudden, severe gas-exchange failure</text><path d="M194 32 L198 41 L208 45 L198 49 L194 59 L190 49 L180 45 L190 41Z" fill="#ffd52d" stroke="#24162b" stroke-width="2.5"/><path d="M 46 194 Q 58 185 76 193 Q 93 186 110 194 L 373 192 Q 414 198 406 230 L 404 512 Q 398 543 369 538 L 63 540 Q 24 536 30 502 L 32 230 Q 26 204 46 194 Z" fill="#e9f1ff" stroke="#24162b" stroke-width="4.2" stroke-linejoin="round"/><path d="M 46 198 Q 68 188 90 197 Q 110 189 129 197 L 384 197 Q 410 200 406 244 L 33 244 Q 26 212 46 198 Z" fill="#a9c9ff" stroke="#24162b" stroke-width="2.8" stroke-linejoin="round"/><path d="M383 212 L387 221 L397 225 L387 229 L383 239 L379 229 L369 225 L379 221Z" fill="#ffe24d" stroke="#24162b" stroke-width="2.5"/><text x="54" y="229" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="800" fill="#20152a">Recognition</text><circle cx="52" cy="262" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 262 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="268" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">Sudden, progressive pulmonary edema</text><text x="71" y="284" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">with increasing bilateral lung</text><text x="71" y="300" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">infiltrates on chest X-ray</text><circle cx="52" cy="317" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 317 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="323" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">Severe dyspnea and</text><text x="71" y="339" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">ventilation-perfusion mismatch may</text><text x="71" y="355" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">develop within 72 hours after a</text><text x="71" y="371" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">precipitating event</text><circle cx="52" cy="388" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 388 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="394" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">Hypoxemia is classified by severity</text><text x="71" y="410" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">and does not respond well to</text><text x="71" y="426" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">supplemental oxygen alone</text><circle cx="52" cy="443" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 443 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="449" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">Crackles and intercostal retractions</text><text x="71" y="465" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">may occur</text><circle cx="52" cy="482" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 482 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="488" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">The lecture also lists BNP levels as</text><text x="71" y="504" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="600" fill="#201b2a">part of the clinical picture</text><path d="M 448 207 Q 460 193 478 201 Q 495 194 512 202 L 785 200 Q 826 206 818 238 L 816 502 Q 810 533 781 528 L 465 530 Q 426 526 432 492 L 434 238 Q 428 212 448 207 Z" fill="#e8faff" stroke="#24162b" stroke-width="4.2" stroke-linejoin="round"/><path d="M 448 206 Q 470 196 492 205 Q 512 197 531 205 L 796 205 Q 822 208 818 252 L 435 252 Q 428 220 448 206 Z" fill="#86dfeb" stroke="#24162b" stroke-width="2.8" stroke-linejoin="round"/><path d="M795 220 L799 229 L809 233 L799 237 L795 247 L791 237 L781 233 L791 229Z" fill="#ffe24d" stroke="#24162b" stroke-width="2.5"/><text x="456" y="237" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="800" fill="#20152a">Underlying Mechanism</text><circle cx="454" cy="270" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M449 270 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="473" y="276" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">The slides describe ARDS without</text><text x="473" y="294" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">elevated left atrial pressure</text><circle cx="454" cy="313" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M449 313 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="473" y="319" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">Fluid and inflammation impair</text><text x="473" y="337" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">oxygen transfer across the lungs</text><circle cx="454" cy="356" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M449 356 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="473" y="362" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">The patient may deteriorate</text><text x="473" y="380" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">rapidly after an acute</text><text x="473" y="398" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">precipitating event</text><circle cx="454" cy="417" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M449 417 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="473" y="423" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">Treat the cause while supporting</text><text x="473" y="441" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="600" fill="#201b2a">oxygenation and circulation</text><path d="M 46 574 Q 58 555 76 563 Q 93 556 110 564 L 383 562 Q 424 568 416 600 L 414 952 Q 408 983 379 978 L 63 980 Q 24 976 30 942 L 32 600 Q 26 574 46 574 Z" fill="#fff0f6" stroke="#24162b" stroke-width="4.2" stroke-linejoin="round"/><path d="M 46 568 Q 68 558 90 567 Q 110 559 129 567 L 394 567 Q 420 570 416 614 L 33 614 Q 26 582 46 568 Z" fill="#f39dd0" stroke="#24162b" stroke-width="2.8" stroke-linejoin="round"/><path d="M393 582 L397 591 L407 595 L397 599 L393 609 L389 599 L379 595 L389 591Z" fill="#ffe24d" stroke="#24162b" stroke-width="2.5"/><text x="54" y="591" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="800" fill="#20152a">Ventilation and</text><text x="54" y="613" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="800" fill="#20152a">Positioning</text><circle cx="52" cy="642" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 642 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="648" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Intubation and mechanical</text><text x="71" y="671" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">ventilation with PEEP may</text><text x="71" y="694" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">help keep alveoli open</text><circle cx="52" cy="718" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 718 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="724" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Prone positioning is</text><text x="71" y="747" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">emphasized for oxygenation</text><circle cx="52" cy="771" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 771 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="777" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Reposition frequently to</text><text x="71" y="800" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">protect skin and other</text><text x="71" y="823" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">tissues</text><circle cx="52" cy="847" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 847 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="853" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Monitor oxygenation and</text><text x="71" y="876" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">hemodynamic response to</text><text x="71" y="899" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">the plan</text><path d="M 458 549 Q 470 540 488 548 Q 505 541 522 549 L 785 547 Q 826 553 818 585 L 816 952 Q 810 983 781 978 L 475 980 Q 436 976 442 942 L 444 585 Q 438 559 458 549 Z" fill="#f5efff" stroke="#24162b" stroke-width="4.2" stroke-linejoin="round"/><path d="M 458 553 Q 480 543 502 552 Q 522 544 541 552 L 796 552 Q 822 555 818 599 L 445 599 Q 438 567 458 553 Z" fill="#bfa8f5" stroke="#24162b" stroke-width="2.8" stroke-linejoin="round"/><path d="M795 567 L799 576 L809 580 L799 584 L795 594 L791 584 L781 580 L791 576Z" fill="#ffe24d" stroke="#24162b" stroke-width="2.5"/><text x="466" y="584" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="800" fill="#20152a">Supportive Care</text><circle cx="464" cy="617" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M459 617 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="483" y="623" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">Treat the underlying cause</text><text x="483" y="644" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">and manage hypovolemia to</text><text x="483" y="665" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">support hemodynamic</text><text x="483" y="686" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">stability</text><circle cx="464" cy="708" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M459 708 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="483" y="714" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">Enteral nutrition is</text><text x="483" y="735" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">preferred when nutritional</text><text x="483" y="756" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">support is needed</text><circle cx="464" cy="778" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M459 778 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="483" y="784" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">Anxiety reduction, sedation,</text><text x="483" y="805" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">or paralysis may be part of</text><text x="483" y="826" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">the prescribed plan</text><circle cx="464" cy="848" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M459 848 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="483" y="854" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">Provide ongoing supportive</text><text x="483" y="875" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">care and prevent</text><text x="483" y="896" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">immobility-related</text><text x="483" y="917" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">complications</text><path d="M28 1015 Q39 1006 52 1014 Q66 1005 78 1014 L770 1014 Q783 1006 796 1014 Q809 1006 821 1019 L821 1067 Q808 1078 796 1070 Q781 1079 768 1070 L79 1070 Q65 1079 51 1070 Q38 1079 28 1068Z" fill="#f6eaff" stroke="#24162b" stroke-width="3.5"/><text x="48" y="1040" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="700" fill="#4d3e51">Source: Hinkle Chapter 19, slides 48-49</text><text x="790" y="1055" text-anchor="end" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="900" fill="#713a7d">17/25</text></svg>