      <circle cx="91" cy="105" r="3.5" fill="#21152c"/><circle cx="118" cy="105" r="3.5" fill="#21152c"/>
      <path d="M96 120 Q104 128 112 120" fill="none"/><path d="M88 63 Q103 40 121 62 L117 71 L93 71Z" fill="#fff"/>
      <path d="M101 54 L106 43 L112 54Z" fill="#e74f91"/><path d="M71 149 Q103 128 136 150 L146 206 L62 206Z" fill="#a98af2"/>
      <path d="M84 153 Q84 178 102 183 Q121 177 121 153" fill="none" stroke="#cf2780" stroke-width="5"/>
