      <path d="M648 75 L653 62 M651 69 L638 69 M797 75 L792 62 M794 69 L807 69" fill="none" stroke="#ffd42e"/>
    </g><text x="208" y="91" font-family="DejaVu Sans,sans-serif" font-size="40" font-weight="900" fill="#3a1246" stroke="#fff" stroke-width="5" paint-order="stroke">Acute Respiratory Failure</text><text x="210" y="144" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#25152b">Rapid deterioration in oxygenation,</text><text x="210" y="163" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#25152b">ventilation, or both</text><path d="M194 32 L198 41 L208 45 L198 49 L194 59 L190 49 L180 45 L190 41Z" fill="#ffd52d" stroke="#24162b" stroke-width="2.5"/><path d="M 46 194 Q 58 185 76 193 Q 93 186 110 194 L 391 192 Q 432 198 424 230 L 422 536 Q 416 567 387 562 L 63 564 Q 24 560 30 526 L 32 230 Q 26 204 46 194 Z" fill="#fff8d9" stroke="#24162b" stroke-width="4.2" stroke-linejoin="round"/><path d="M 46 198 Q 68 188 90 197 Q 110 189 129 197 L 402 197 Q 428 200 424 244 L 33 244 Q 26 212 46 198 Z" fill="#ffd962" stroke="#24162b" stroke-width="2.8" stroke-linejoin="round"/><path d="M401 212 L405 221 L415 225 L405 229 L401 239 L397 229 L387 225 L397 221Z" fill="#ffe24d" stroke="#24162b" stroke-width="2.5"/><text x="54" y="229" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="800" fill="#20152a">Pathophysiology</text><circle cx="52" cy="262" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 262 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="268" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">May rapidly progress to</text><text x="71" y="291" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">hypoxemia, hypercapnia,</text><text x="71" y="314" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">and respiratory acidosis</text><circle cx="52" cy="338" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 338 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="344" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Ventilation or perfusion</text><text x="71" y="367" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">mechanisms are impaired</text><circle cx="52" cy="391" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 391 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="397" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">The underlying cause must</text><text x="71" y="420" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">be identified and treated</text><circle cx="52" cy="444" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M47 444 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="450" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Frequent reassessment is</text><text x="71" y="473" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">essential because status</text><text x="71" y="496" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">can change quickly</text><path d="M 466 210 Q 478 196 496 204 Q 513 197 530 205 L 787 203 Q 828 209 820 241 L 818 530 Q 812 561 783 556 L 483 558 Q 444 554 450 520 L 452 241 Q 446 215 466 210 Z" fill="#e9f1ff" stroke="#24162b" stroke-width="4.2" stroke-linejoin="round"/><path d="M 466 209 Q 488 199 510 208 Q 530 200 549 208 L 798 208 Q 824 211 820 255 L 453 255 Q 446 223 466 209 Z" fill="#a9c9ff" stroke="#24162b" stroke-width="2.8" stroke-linejoin="round"/><path d="M797 223 L801 232 L811 236 L801 240 L797 250 L793 240 L783 236 L793 232Z" fill="#ffe24d" stroke="#24162b" stroke-width="2.5"/><text x="474" y="240" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="800" fill="#20152a">Early Warning Signs</text><circle cx="472" cy="273" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M467 273 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="491" y="279" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Restlessness</text><circle cx="472" cy="303" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M467 303 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="491" y="309" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Tachycardia or</text><text x="491" y="332" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">hypertension</text><circle cx="472" cy="356" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M467 356 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="491" y="362" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Fatigue and headache</text><circle cx="472" cy="386" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M467 386 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="491" y="392" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Accessory-muscle use and</text><text x="491" y="415" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">decreased breath sounds</text><text x="491" y="438" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">may be present</text><path d="M 47 599 Q 59 580 77 588 Q 94 581 111 589 L 368 587 Q 409 593 401 625 L 399 947 Q 393 978 364 973 L 64 975 Q 25 971 31 937 L 33 625 Q 27 599 47 599 Z" fill="#e8faff" stroke="#24162b" stroke-width="4.2" stroke-linejoin="round"/><path d="M 47 593 Q 69 583 91 592 Q 111 584 130 592 L 379 592 Q 405 595 401 639 L 34 639 Q 27 607 47 593 Z" fill="#86dfeb" stroke="#24162b" stroke-width="2.8" stroke-linejoin="round"/><path d="M378 607 L382 616 L392 620 L382 624 L378 634 L374 624 L364 620 L374 616Z" fill="#ffe24d" stroke="#24162b" stroke-width="2.5"/><text x="55" y="624" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="800" fill="#20152a">Late Danger Signs</text><circle cx="53" cy="657" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M48 657 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="663" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Confusion or lethargy</text><circle cx="53" cy="687" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M48 687 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="693" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Central cyanosis and</text><text x="72" y="716" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">diaphoresis</text><circle cx="53" cy="740" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M48 740 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="746" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Respiratory arrest</text><circle cx="53" cy="770" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M48 770 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="776" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">Escalate promptly when</text><text x="72" y="799" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">signs of deterioration</text><text x="72" y="822" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#201b2a">appear</text><path d="M 438 578 Q 450 569 468 577 Q 485 570 502 578 L 787 576 Q 828 582 820 614 L 818 948 Q 812 979 783 974 L 455 976 Q 416 972 422 938 L 424 614 Q 418 588 438 578 Z" fill="#fff0f6" stroke="#24162b" stroke-width="4.2" stroke-linejoin="round"/><path d="M 438 582 Q 460 572 482 581 Q 502 573 521 581 L 798 581 Q 824 584 820 628 L 425 628 Q 418 596 438 582 Z" fill="#f39dd0" stroke="#24162b" stroke-width="2.8" stroke-linejoin="round"/><path d="M797 596 L801 605 L811 609 L801 613 L797 623 L793 613 L783 609 L793 605Z" fill="#ffe24d" stroke="#24162b" stroke-width="2.5"/><text x="446" y="605" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="800" fill="#20152a">Management and</text><text x="446" y="627" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="800" fill="#20152a">Support</text><circle cx="444" cy="656" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M439 656 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="463" y="662" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">Treat the underlying cause;</text><text x="463" y="683" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">intubation and mechanical</text><text x="463" y="704" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">ventilation may be needed</text><circle cx="444" cy="726" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M439 726 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="463" y="732" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">Enteral nutrition is preferred</text><text x="463" y="753" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">when nutritional support is</text><text x="463" y="774" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">indicated in the slides</text><circle cx="444" cy="796" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M439 796 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="463" y="802" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">Reduce anxiety and provide a</text><text x="463" y="823" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">way for the patient to</text><text x="463" y="844" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">communicate</text><circle cx="444" cy="866" r="10" fill="#fff" stroke="#ed267e" stroke-width="2.5"/><path d="M439 866 l4 4 l7 -9" fill="none" stroke="#ed267e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="463" y="872" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">Prevent complications with</text><text x="463" y="893" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">turning, range of motion,</text><text x="463" y="914" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" fill="#201b2a">mouth care, and skin care</text><path d="M28 1015 Q39 1006 52 1014 Q66 1005 78 1014 L770 1014 Q783 1006 796 1014 Q809 1006 821 1019 L821 1067 Q808 1078 796 1070 Q781 1079 768 1070 L79 1070 Q65 1079 51 1070 Q38 1079 28 1068Z" fill="#f6eaff" stroke="#24162b" stroke-width="3.5"/><text x="48" y="1040" font-family="DejaVu Sans,sans-serif" font-size="12" font-weight="700" fill="#4d3e51">Source: Hinkle Chapter 19, slides 46-47</text><text x="790" y="1055" text-anchor="end" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="900" fill="#713a7d">16/25</text></svg>