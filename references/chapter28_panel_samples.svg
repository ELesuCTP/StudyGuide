<text x="600" y="98" text-anchor="middle" class="title">PANEL EXAMPLES</text><text x="600" y="132" text-anchor="middle" class="head">Sleep-Wake Disorders · filled sample cards</text>
<!-- complication / impact -->
<g filter="url(#shadow)"><path d="M62 192Q80 174 108 185Q135 168 162 187H1089Q1115 177 1138 198Q1155 216 1147 245V591Q1127 611 1098 598H108Q80 612 61 589Q46 572 55 542V226Q50 207 62 192Z" fill="#fff0f5" class="ink"/><path d="M57 225Q51 195 81 185Q94 180 109 186Q135 166 162 186H1089Q1117 175 1140 197Q1155 214 1148 240H55Z" fill="#f6a2d5" class="thin"/></g>
<path d="M92 206L103 183L116 206L139 209L122 225L126 246L103 236L82 246L86 225L69 209Z" fill="#ffe154" class="thin"/><text x="610" y="219" text-anchor="middle" class="head">Complication / Functional Impact</text>
<text x="94" y="278" class="label">SLEEP PROBLEMS IN OLDER ADULTS</text><text x="95" y="328" class="check">✓</text><text x="136" y="328" class="body">Poor sleep quality is linked with cognitive impairment,</text><text x="136" y="362" class="body">depression, anxiety, and increased fall risk.</text>
<text x="95" y="416" class="check">✓</text><text x="136" y="416" class="body">Insomnia may interfere with social and occupational</text><text x="136" y="450" class="body">functioning; daytime sleepiness can create danger.</text>
<text x="95" y="504" class="check">✓</text><text x="136" y="504" class="body">Nursing focus: assess sleep quality and daily function;</text><text x="136" y="538" class="body">teach about the effects of poor-quality sleep.</text>
<!-- senior doodle -->
<circle cx="1034" cy="362" r="66" fill="#ffd2aa" class="thin"/><path d="M976 354Q978 288 1038 293Q1091 299 1098 351Q1074 330 1054 329Q1025 356 981 354Z" fill="#a35c30" class="thin"/><circle cx="1012" cy="364" r="6" fill="#21152c"/><circle cx="1056" cy="364" r="6" fill="#21152c"/><path d="M1023 389Q1035 397 1047 388" fill="none" class="thin"/><path d="M1000 438Q1034 414 1068 438L1090 515H980Z" fill="#bda5ff" class="thin"/><path d="M995 478Q965 461 963 437M1071 478Q1097 460 1100 437" fill="none" class="thin"/>
<text x="1034" y="563" text-anchor="middle" class="small">Assess the whole day, too.</text>
<!-- safety -->
