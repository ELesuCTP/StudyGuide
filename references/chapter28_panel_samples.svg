.head{font:900 30px 'Trebuchet MS',sans-serif;fill:#20152a}.body{font:700 23px 'Trebuchet MS',sans-serif;fill:#211b2a}.small{font:700 18px 'Trebuchet MS',sans-serif;fill:#211b2a}.label{font:900 16px 'Trebuchet MS',sans-serif;letter-spacing:1px;fill:#49304c}.check{font:900 27px 'Trebuchet MS',sans-serif;fill:#ed267e}
