<text x="95" y="756" class="label">SLEEPWALKING · SOMNAMBULISM</text><text x="92" y="810" class="check">✓</text><text x="133" y="810" class="body">Secure the environment and</text><text x="133" y="844" class="body">remove hazards.</text>
<text x="92" y="900" class="check">✓</text><text x="133" y="900" class="body">Protect the person from injury,</text><text x="133" y="934" class="body">including falls and other harm.</text>
<text x="92" y="990" class="check">✓</text><text x="133" y="990" class="body">Plan with family/caregivers;</text><text x="133" y="1024" class="body">use safety features as needed.</text>
