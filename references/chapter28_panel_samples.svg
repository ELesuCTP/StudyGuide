<g filter="url(#shadow)"><path d="M650 668Q670 648 699 659Q727 640 754 660H1097Q1124 649 1143 670Q1158 688 1149 718V1092Q1131 1112 1103 1100H703Q674 1114 652 1091Q638 1074 647 1044V700Q641 682 650 668Z" fill="#f3efff" class="ink"/><path d="M646 699Q640 671 669 660Q686 653 703 660Q728 639 755 659H1098Q1125 648 1145 669Q1158 686 1151 714H644Z" fill="#c9afff" class="thin"/></g>
<rect x="676" y="669" width="46" height="22" rx="11" transform="rotate(-18 699 680)" fill="#ff78ac" class="thin"/><path d="M697 667L708 689" class="thin" fill="none"/><text x="900" y="693" text-anchor="middle" class="head">Medication Watch</text>
<text x="679" y="756" class="label">SLEEP-RELATED MEDICATIONS</text><text x="677" y="810" class="check">✓</text><text x="718" y="810" class="body">Assess for confusion, memory problems,</text><text x="718" y="844" class="body">excessive sedation, and falls.</text>
<text x="677" y="900" class="check">✓</text><text x="718" y="900" class="body">Monitor for drug interactions and</text><text x="718" y="934" class="body">increased CNS-depressant effects.</text>
<text x="677" y="990" class="check">✓</text><text x="718" y="990" class="body">Use the lowest effective dose as directed;</text><text x="718" y="1024" class="body">teach about safe use and side effects.</text>
<path d="M1058 1046L1090 990L1122 1046Z" fill="#ffe05a" class="thin"/><text x="1090" y="1039" text-anchor="middle" class="head">!</text>
<!-- style note -->
<path d="M96 1194Q117 1174 146 1186Q172 1168 201 1187H1001Q1031 1173 1058 1190Q1085 1171 1112 1190Q1140 1177 1157 1200V1383Q1139 1401 1110 1388Q1083 1406 1055 1387Q1027 1404 999 1387H199Q171 1405 145 1388Q115 1405 96 1384Z" fill="#fff6b8" class="ink"/>
<text x="626" y="1244" text-anchor="middle" class="head">Why add these panels?</text>
<text x="143" y="1294" class="body">They make consequences, injury prevention, and medication monitoring</text><text x="143" y="1330" class="body">easy to find without forcing every topic into the same page grid.</text>
<text x="600" y="1449" text-anchor="middle" class="small">Sample facts transcribed from the supplied Chapter 28 examples. Verify against the assigned source.</text></svg>