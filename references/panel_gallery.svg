<!-- Organic cards: varied header bands, scallops, clipped corners and doodles -->
<g filter="url(#s)"><path d="M60 190Q78 174 105 184Q130 168 159 186H535Q563 175 580 198Q595 217 584 244V482Q566 502 540 490H104Q77 504 60 483Q47 465 55 438V224Q50 205 60 190Z" fill="#fff0f4" class="ink"/><path d="M57 222Q51 194 79 184Q94 178 106 185Q130 167 159 185H535Q563 174 584 198Q596 214 585 239H55Z" fill="#f6a3d7" class="thin"/></g>
<path d="M91 204L102 181L115 204L138 207L121 223L125 244L102 234L81 244L85 223L68 207Z" fill="#ffe05a" class="thin"/>
<text x="330" y="219" text-anchor="middle" class="head">Complication Watch</text><text x="82" y="276" class="label">CONSEQUENCE → CUE → RESPONSE</text>
<text x="81" y="320" class="check">✓</text><text x="116" y="320" class="body">Name a source-supported consequence.</text><text x="81" y="366" class="check">✓</text><text x="116" y="366" class="body">Show the cue that signals added risk.</text><text x="81" y="412" class="check">✓</text><text x="116" y="412" class="body">Add the safety or nursing response.</text><path d="M500 455L535 393L570 455Z" fill="#ffe05a" class="thin"/><text x="535" y="447" text-anchor="middle" class="head">!</text><text x="320" y="470" text-anchor="middle" class="small">Use only when the chapter supports it.</text>
<g filter="url(#s)"><path d="M638 193Q655 178 679 187Q702 169 731 188H1090Q1118 178 1140 198Q1156 216 1147 244V486Q1127 505 1098 492H680Q653 504 637 484Q622 465 632 436V229Q627 207 638 193Z" fill="#edfbff" class="ink"/><path d="M634 221Q627 194 655 185Q674 178 690 187Q712 169 733 188H1090Q1118 177 1142 197Q1157 213 1148 238H631Z" fill="#8ce3ef" class="thin"/></g>
<path d="M675 202Q675 190 687 190Q699 190 699 202V215H675Z" fill="#fff" class="thin"/><text x="895" y="219" text-anchor="middle" class="head">Safety / Nursing Action</text><text x="664" y="276" class="label">CLEAR VERB + SPECIFIC HAZARD</text>
<text x="663" y="320" class="check">✓</text><text x="698" y="320" class="body">Protect from the source-named hazard.</text><text x="663" y="366" class="check">✓</text><text x="698" y="366" class="body">Secure the environment; remove risks.</text><text x="663" y="412" class="check">✓</text><text x="698" y="412" class="body">Teach, reassess, document as indicated.</text><text x="663" y="458" class="small">Use a bold icon so priority is seen quickly.</text>
<g filter="url(#s)"><path d="M69 548Q88 529 116 540Q144 522 172 541H560Q587 530 607 552Q623 570 615 600V843Q598 863 571 851H115Q86 863 68 841Q54 823 63 795V583Q59 563 69 548Z" fill="#f3efff" class="ink"/><path d="M64 578Q57 550 84 541Q101 534 117 542Q144 520 172 541H560Q590 529 612 552Q626 568 617 594H62Z" fill="#c9afff" class="thin"/></g>
<rect x="81" y="550" width="42" height="19" rx="9" transform="rotate(-22 102 559)" fill="#ff70a8" class="thin"/><text x="342" y="576" text-anchor="middle" class="head">Medication Watch</text><text x="89" y="629" class="label">DRUG → PURPOSE → MONITOR / TEACH</text>
<text x="88" y="673" class="check">✓</text><text x="123" y="673" class="body">Keep named medicines with their disorder.</text><text x="88" y="719" class="check">✓</text><text x="123" y="719" class="body">Highlight supported adverse effects,</text><text x="123" y="748" class="body">interactions, and precautions.</text><text x="88" y="794" class="check">✓</text><text x="123" y="794" class="body">Add what to assess and teach.</text><path d="M520 792Q540 770 557 790L579 816Q590 831 575 845L563 854Q549 863 538 848L518 823Q506 806 520 792Z" fill="#fff" class="thin"/>
<g filter="url(#s)"><path d="M651 553Q670 534 699 542Q726 525 754 543H1097Q1124 531 1143 552Q1158 570 1149 599V841Q1131 863 1104 850H704Q675 864 654 841Q639 824 648 794V584Q642 568 651 553Z" fill="#effbe9" class="ink"/><path d="M647 579Q641 551 670 542Q687 535 704 543Q728 522 755 542H1097Q1125 530 1145 552Q1158 568 1151 594H646Z" fill="#b8ed9c" class="thin"/></g>
<path d="M684 565Q700 546 716 565Q732 546 748 565Q732 581 716 590Q699 581 684 565Z" fill="#ff84bf" class="thin"/><text x="900" y="576" text-anchor="middle" class="head">Compare at a Glance</text><text x="678" y="629" class="label">ONLY THE DISTINGUISHING CUES</text><path d="M895 650V827" stroke="#a68bbb" stroke-width="3" stroke-dasharray="7 8"/>
<text x="684" y="682" class="head">Concept A</text><text x="930" y="682" class="head">Concept B</text><text x="684" y="725" class="body">Signature cue</text><text x="930" y="725" class="body">Signature cue</text><text x="684" y="765" class="body">When / where</text><text x="930" y="765" class="body">When / where</text><text x="684" y="805" class="body">What to do</text><text x="930" y="805" class="body">What to do</text><text x="900" y="838" text-anchor="middle" class="small">One comparison panel; don't grid the whole page.</text>
<g filter="url(#s)"><path d="M75 911Q95 889 122 901Q150 883 177 902H570Q594 893 611 915Q625 934 616 963V1202Q599 1222 572 1210H121Q92 1220 74 1201Q61 1184 68 1156V943Q64 925 75 911Z" fill="#fff8db" class="ink"/><path d="M69 940Q63 911 91 902Q105 896 122 902Q147 881 177 901H569Q595 891 614 914Q627 929 618 957H67Z" fill="#ffd963" class="thin"/></g>
<path d="M103 915Q119 894 135 915Q151 894 167 915Q152 931 135 940Q118 931 103 915Z" fill="#fff" class="thin"/><text x="350" y="937" text-anchor="middle" class="head">Clinical Cue → Nursing Move</text><text x="96" y="990" class="label">SHORT SOURCE-BASED MINI SCENARIO</text><rect x="94" y="1010" width="472" height="58" rx="18" fill="#fff" class="thin"/><text x="115" y="1047" class="body">Notice: the patient reports / shows…</text><path d="M330 1076V1100M318 1093L330 1110L342 1093" stroke="#e33785" stroke-width="5" fill="none" stroke-linecap="round"/><rect x="94" y="1118" width="472" height="58" rx="18" fill="#fff" class="thin"/><text x="115" y="1155" class="body">Respond: assess, protect, teach, escalate.</text><text x="330" y="1200" text-anchor="middle" class="small">Avoid unsupported actions or extra diagnoses.</text>
<g filter="url(#s)"><path d="M663 914Q682 894 709 904Q736 886 762 904H1099Q1125 892 1145 914Q1159 931 1151 962V1201Q1135 1220 1108 1210H710Q680 1222 662 1200Q648 1183 657 1157V944Q652 928 663 914Z" fill="#fff0a8" class="ink"/><path d="M657 941Q651 912 679 904Q693 899 710 904Q735 884 763 904H1099Q1127 892 1147 913Q1160 930 1153 956H655Z" fill="#ff85c2" class="thin"/></g>
<path d="M1097 904L1107 882L1119 902L1142 905L1124 921L1128 943L1107 931L1086 943L1090 921L1073 905Z" fill="#ffe45d" class="thin"/><text x="885" y="938" text-anchor="middle" class="head">Quick Memory</text><text x="695" y="1005" class="check">✓</text><text x="730" y="1005" class="body">Three high-value takeaways are enough.</text><text x="695" y="1064" class="check">✓</text><text x="730" y="1064" class="body">Use recall cues, not a second copy.</text><text x="695" y="1123" class="check">✓</text><text x="730" y="1123" class="body">Keep type large and contrast high.</text><path d="M1082 1143Q1100 1121 1117 1142Q1135 1120 1152 1142Q1136 1161 1117 1172Q1100 1161 1082 1143Z" fill="#fb3a91" class="thin"/>
<path d="M96 1282Q118 1263 145 1275Q172 1257 200 1276H1000Q1030 1262 1056 1279Q1084 1261 1111 1279Q1141 1265 1158 1289V1493Q1139 1511 1110 1498Q1083 1516 1055 1497Q1027 1514 999 1497H197Q169 1515 144 1498Q114 1515 95 1494Z" fill="#e9faff" class="ink"/>
<text x="627" y="1332" text-anchor="middle" class="head">Loose page layout; precise content.</text><text x="138" y="1384" class="body">• Let the content decide each panel's size and placement.</text><text x="138" y="1427" class="body">• Mix shapes and doodles; keep a consistent visual voice.</text><text x="138" y="1470" class="body">• Use color to signal meaning and preserve legibility.</text>
<text x="600" y="1552" text-anchor="middle" class="small">Style reference only · Check clinical details against the assigned source.</text></svg>