<title id="t">Cartoon Study Guide Panel Gallery</title><desc id="d">Editable hand-drawn message-board study guide panel patterns for complication watch, safety, medication monitoring, comparison, clinical cues, and quick review.</desc>
<defs><filter id="s" x="-10%" y="-10%" width="125%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#351044" flood-opacity=".18"/></filter><style>
.ink{stroke:#21152c;stroke-width:5;stroke-linejoin:round;stroke-linecap:round}.thin{stroke:#21152c;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.title{font:900 60px 'Trebuchet MS',sans-serif;fill:#351044;stroke:#fff;stroke-width:7;paint-order:stroke}.head{font:900 28px 'Trebuchet MS',sans-serif;fill:#21152c}
.body{font:700 21px 'Trebuchet MS',sans-serif;fill:#211b2a}.small{font:700 17px 'Trebuchet MS',sans-serif;fill:#211b2a}.label{font:900 16px 'Trebuchet MS',sans-serif;letter-spacing:1px;fill:#49304c}.check{font:900 24px 'Trebuchet MS',sans-serif;fill:#ed267e}
</style></defs>
